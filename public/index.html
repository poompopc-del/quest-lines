<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1f27">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Quest Lines — English RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Sarabun:wght@400;500;600;700&family=Cinzel:wght@600;700;800&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0e1f27; --deep:#142b34; --panel:#1b3540; --panel-2:#224353; --edge:#3d6b72; --edge-hi:#5fa3a0;
  --ink:#f2faf6; --ink-dim:#aecdca; --ink-faint:#6f9997;
  --ember:#ff9d5c; --ember-hi:#ffc386; --rune:#7fe0cf; --gold:#e8c477;
  --blood:#e2705a; --leaf:#7fd88a; --shadow:#081418;
  --px:3px;
  --f-pixel:'Pixelify Sans', 'Sarabun', monospace;
  --f-display:'Cinzel', 'Pixelify Sans', serif;
  --f-ui:'Sarabun', 'Noto Sans Thai', 'Leelawadee UI', system-ui, sans-serif;
  --f-story:'Spectral', Georgia, serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; min-height:100%; color:var(--ink); font-family:var(--f-ui); font-weight:400; font-size:17px; line-height:1.65;
  background:var(--void);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  overflow-x:hidden;
}
#sky{position:fixed; inset:0; width:100%; height:100%; z-index:0; image-rendering:pixelated; pointer-events:none;}
button{font-family:inherit; color:inherit;}
button:focus-visible, input:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--rune); outline-offset:3px;}
.app{position:relative; z-index:1; max-width:520px; margin:0 auto; padding:10px 14px 110px;}
.pixel{font-family:var(--f-pixel); letter-spacing:.02em;}
.hidden{display:none !important;}

/* ---------- pixel box: notched corners made from four offset shadows ---------- */
.px{
  background:var(--panel);
  box-shadow: 0 calc(var(--px) * -1) 0 var(--edge), 0 var(--px) 0 var(--edge),
              calc(var(--px) * -1) 0 0 var(--edge), var(--px) 0 0 var(--edge),
              inset 0 var(--px) 0 rgba(255,255,255,.06), inset 0 calc(var(--px) * -1) 0 rgba(0,0,0,.25);
  margin:var(--px);
}
.px.dark{background:var(--deep);}
.px.hot{--edge:var(--ember);}
.px.cool{--edge:var(--rune);}
.px.gold{--edge:var(--gold);}
.panel{padding:16px;}

/* ---------- HUD ---------- */
.hud{
  position:sticky; top:0; z-index:20; margin:0 -14px 14px; padding:10px 14px 10px;
  padding-top:calc(10px + env(safe-area-inset-top,0px)); margin-top:calc(-10px - env(safe-area-inset-top,0px));
  background:linear-gradient(180deg, rgba(20,15,43,.97) 70%, rgba(20,15,43,0));
  display:flex; align-items:center; gap:12px;
}
.hud-avatar{width:46px; height:46px; flex:none; display:grid; place-items:center; font-size:28px; background:var(--panel-2); position:relative; box-shadow:0 0 0 2px rgba(255,157,92,.35), 0 0 10px rgba(255,157,92,.3);}
.hud-lv{position:absolute; bottom:-8px; left:50%; transform:translateX(-50%); font-family:var(--f-pixel); font-size:13px; background:var(--ember); color:#2a0f00; padding:0 5px; line-height:15px; white-space:nowrap; box-shadow:0 0 6px rgba(255,157,92,.6);}
.hud-main{flex:1; min-width:0;}
.hud-name{font-weight:600; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.hud-xp{height:7px; background:var(--shadow); margin-top:5px; position:relative;}
.hud-xp > i{position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg,var(--ember),var(--ember-hi)); transition:width .5s;}
.hud-xptext{font-family:var(--f-pixel); font-size:10.5px; color:var(--ink-dim); margin-top:2px;}
.hud-stats{display:flex; gap:10px; font-family:var(--f-pixel); font-size:17px; flex:none;}
.hud-stats span{display:flex; align-items:center; gap:4px;}

/* ---------- title ---------- */
.title-block{text-align:center; margin:10px 0 22px; position:relative;}
.title-block::before{
  content:""; position:absolute; left:50%; top:50%; width:340px; height:180px; transform:translate(-50%,-50%);
  background:radial-gradient(closest-side, rgba(255,157,92,.28), rgba(255,157,92,0) 72%); pointer-events:none; z-index:-1;
}
.game-title{
  font-family:var(--f-display); font-weight:800; font-size:46px; line-height:1.1; margin:0; letter-spacing:.06em;
  background:linear-gradient(180deg, var(--ember-hi) 20%, var(--ember) 60%, #d9612c 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:var(--ember-hi);
  text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 34px rgba(255,122,61,.55);
  animation: titleGlow 3.2s ease-in-out infinite;
}
@keyframes titleGlow{ 0%,100%{filter:drop-shadow(0 0 6px rgba(255,157,92,.35));} 50%{filter:drop-shadow(0 0 18px rgba(255,157,92,.75));} }
.game-sub{color:var(--ink-dim); font-size:15px; margin-top:10px; letter-spacing:.02em;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; border:0;
  font-family:var(--f-ui); font-weight:600; font-size:17px; padding:12px 18px; color:var(--ink);
  background:var(--panel-2); transition:transform .08s, filter .15s, box-shadow .15s; user-select:none;
}
.btn.px{margin:var(--px);}
.btn:hover:not(:disabled){filter:brightness(1.15); transform:translateY(-1px);}
.btn:active:not(:disabled){transform:translateY(2px);}
.btn:disabled{opacity:.45; cursor:default;}
.btn.primary{background:linear-gradient(180deg,var(--ember-hi),var(--ember)); color:#2a0f00; --edge:#ffd2a6; font-weight:700; box-shadow:0 0 16px rgba(255,157,92,.4);}
.btn.primary:hover:not(:disabled){box-shadow:0 0 24px rgba(255,157,92,.65);}
.btn.rune{background:linear-gradient(180deg,#8ff7ee,var(--rune)); color:#062a28; --edge:#c8fff9; font-weight:700; box-shadow:0 0 14px rgba(127,224,207,.35);}
.btn.ghost{background:transparent;}
.btn.danger{--edge:var(--blood); color:#ffd0d8; background:rgba(255,77,109,.12);}
.btn.block{display:flex; width:calc(100% - 6px);}
.btn.small{font-size:15px; padding:7px 12px;}
.back{background:none; border:0; color:var(--ink-dim); cursor:pointer; font-size:16px; padding:4px 0; margin-bottom:8px; font-weight:500;}
.back:hover{color:var(--ink);}

/* ---------- hub ---------- */
.tower-tile{display:block; width:calc(100% - 6px); text-align:left; cursor:pointer; border:0; padding:0; overflow:hidden; position:relative; background:var(--deep); --edge:var(--ember);}
.tower-scene{height:170px; position:relative; background:
  radial-gradient(ellipse 60% 70% at 50% 110%, rgba(255,122,61,.35), transparent 70%),
  linear-gradient(180deg,#221647,#130d2a);}
.tower-scene canvas{position:absolute; left:50%; bottom:18px; transform:translateX(-50%); width:120px; height:120px; image-rendering:pixelated;}
.tower-floor{position:absolute; left:0; right:0; bottom:0; height:22px; background:repeating-linear-gradient(90deg,#2b1e5c 0 16px,#241950 16px 32px); border-top:3px solid #3d2d7e;}
.tower-info{padding:12px 16px 14px; display:flex; align-items:center; gap:12px;}
.tower-info h3{margin:0; font-family:var(--f-pixel); font-size:25px; color:var(--ember-hi); font-weight:700;}
.tower-info p{margin:2px 0 0; font-size:15px; color:var(--ink-dim);}
.tower-info .go{margin-left:auto; font-family:var(--f-pixel); font-size:17px; background:var(--ember); color:#2a0f00; padding:6px 12px; white-space:nowrap;}
.tower-badge{position:absolute; top:10px; left:12px; font-family:var(--f-pixel); font-size:15px; background:rgba(10,7,24,.7); padding:3px 8px; color:var(--gold);}
.char-tile{display:flex; align-items:center; gap:14px; width:calc(100% - 6px); text-align:left; cursor:pointer; border:0; padding:16px; background:var(--deep); --edge:var(--ember);}
.char-tile .ava{width:64px; height:64px; flex:none; display:grid; place-items:center; font-size:38px; background:var(--panel-2); position:relative; overflow:hidden;}
.char-tile .ava img{width:100%; height:100%; object-fit:cover;}
.char-tile .ava .lv{position:absolute; bottom:-8px; left:50%; transform:translateX(-50%); font-family:var(--f-pixel); font-size:13px; background:var(--ember); color:#2a0f00; padding:0 6px; line-height:16px; white-space:nowrap;}
.char-tile .ci{flex:1; min-width:0;}
.char-tile h3{margin:0; font-family:var(--f-pixel); font-size:20px; color:var(--ember-hi); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.char-tile p{margin:2px 0 6px; font-size:13px; color:var(--ink-dim);}
.char-tile .go{font-family:var(--f-pixel); font-size:13px; color:var(--rune);}
.vocab-tile{display:block; width:calc(100% - 6px); text-align:left; cursor:pointer; border:0; padding:14px 16px; background:var(--panel); --edge:var(--rune); margin-top:14px;}
.vocab-tile .vh{display:flex; align-items:center; gap:8px;}
.vocab-tile .vh h4{margin:0; font-weight:500; font-size:18px; flex:1;}
.vocab-tile .vh span{font-family:var(--f-pixel); font-size:13px; color:var(--rune);}
.vocab-tile .words{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
.vocab-tile .w{background:var(--deep); padding:6px 10px; font-size:14px; --edge:var(--edge);}
.vocab-tile .w b{color:var(--gold);}
.vocab-tile .w small{display:block; color:var(--ink-dim); font-size:11.5px;}

.mode-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 14px; margin-top:16px;}
.mode-tile{cursor:pointer; border:0; text-align:left; padding:14px; min-height:112px; display:flex; flex-direction:column; justify-content:space-between; background:var(--panel);}
.mode-tile.wide{grid-column:1 / -1; flex-direction:row; align-items:center; gap:14px; min-height:0;}
.mode-tile .ico{font-size:34px; line-height:1;}
.mode-tile h4{margin:8px 0 2px; font-weight:500; font-size:18px;}
.mode-tile.wide h4{margin-top:0;}
.mode-tile p{margin:0; font-size:12.5px; color:var(--ink-dim); line-height:1.4;}
.mode-tile .pill{font-family:var(--f-pixel); font-size:14px; color:var(--rune);}

.section-h{display:flex; align-items:baseline; justify-content:space-between; margin:24px 4px 10px;}
.section-h h3{margin:0; font-size:18px; font-weight:500;}
.section-h small{color:var(--ink-dim); font-size:14px;}

.quest{display:flex; align-items:center; gap:12px; padding:11px 14px; margin-bottom:10px; background:var(--deep);}
.quest .q-txt{flex:1; min-width:0;}
.quest .q-name{font-size:16px;}
.quest .q-bar{height:6px; background:var(--shadow); margin-top:6px; position:relative;}
.quest .q-bar i{position:absolute; inset:0 auto 0 0; background:var(--rune);}
.quest .q-num{font-family:var(--f-pixel); font-size:14px; color:var(--ink-dim); margin-top:3px;}
.quest .btn{flex:none;}
.quest.done{opacity:.55;}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(0deg, rgba(20,15,43,1) 60%, rgba(20,15,43,.0));
}
.tabbar-in{max-width:520px; margin:0 auto; display:flex; gap:6px; background:var(--deep);}
.tab{flex:1; border:0; background:none; cursor:pointer; padding:8px 2px 6px; display:flex; flex-direction:column; align-items:center; gap:1px; color:var(--ink-dim); font-size:11.5px; font-weight:500; transition:color .15s;}
.tab b{font-size:23px; line-height:1.1; font-weight:400; filter:grayscale(.7); opacity:.8; transition:filter .15s, opacity .15s, transform .15s;}
.tab.on{color:var(--ink);}
.tab.on b{filter:none; opacity:1; transform:translateY(-1px); text-shadow:0 0 10px rgba(255,157,92,.6);}
.tab.on::after{content:""; width:18px; height:3px; background:var(--ember); margin-top:2px; box-shadow:0 0 8px var(--ember);}

/* ---------- forms / chips ---------- */
.field-label{display:block; font-size:15px; color:var(--ink-dim); margin:16px 0 8px;}
.text-in{width:calc(100% - 6px); font-family:var(--f-ui); font-size:17px; color:var(--ink); background:var(--shadow); border:0; padding:12px 14px; --edge:var(--edge);}
.text-in::placeholder{color:var(--ink-faint);}
.chips{display:flex; gap:10px; flex-wrap:wrap;}
.chip{flex:1 1 0; min-width:84px; cursor:pointer; border:0; padding:10px 8px; background:var(--deep); text-align:center; font-size:16px; font-weight:500; transition:background .15s, box-shadow .15s;}
.chip small{display:block; font-size:11.5px; color:var(--ink-dim);}
.chip.on{--edge:var(--ember); background:#3a2250; box-shadow:0 0 12px rgba(255,157,92,.3);}
.class-card{flex:1 1 0; min-width:0; cursor:pointer; border:0; padding:12px 8px 10px; background:var(--deep); text-align:center;}
.class-card .e{font-size:37px;}
.class-card .n{font-weight:500; font-size:16px; margin-top:4px;}
.class-card .s{font-family:var(--f-pixel); font-size:11.5px; color:var(--ink-dim); line-height:1.5; margin-top:4px;}
.class-card.on{--edge:var(--ember); background:#3a2250;}
.class-desc{font-size:15px; color:var(--ink-dim); margin-top:10px; min-height:40px;}

/* ---------- story ---------- */
.scene-wrap{position:relative; aspect-ratio:16/9; background:#000; overflow:hidden;}
.scene-wrap canvas{width:100%; height:100%; display:block; image-rendering:pixelated;}
.scene-tag{position:absolute; top:8px; left:8px; font-family:var(--f-pixel); font-size:14px; background:rgba(10,7,24,.75); padding:2px 8px; color:var(--gold);}
.scene-text{font-family:var(--f-story); font-size:21px; line-height:1.7; padding:16px 18px; margin-top:14px; background:var(--deep);}
.scene-text .typing::after{content:"▌"; color:var(--ember); animation:blink 1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
.opts{margin-top:14px; display:flex; flex-direction:column; gap:8px;}
.opt{display:flex; gap:12px; align-items:flex-start; text-align:left; cursor:pointer; border:0; background:var(--panel); padding:12px 14px; font-family:var(--f-story); font-size:18px; line-height:1.45; width:calc(100% - 6px);}
.opt .k{font-family:var(--f-pixel); font-size:16px; background:var(--edge); color:var(--ink); width:24px; height:24px; flex:none; display:grid; place-items:center;}
.opt:hover:not(:disabled){--edge:var(--ember);}
.opt:hover:not(:disabled) .k{background:var(--ember); color:#2a0f00;}
.opt:disabled{opacity:.45; cursor:default;}
.free-row{display:flex; gap:8px; margin-top:6px;}
.free-row .text-in{flex:1; width:auto;}
.vocab-box{margin-top:16px; padding:14px 16px; background:var(--deep); --edge:#3a2f70;}
.vocab-box h4{margin:0 0 8px; font-size:15px; color:var(--ink-dim); font-weight:400;}
.vocab-row{display:flex; align-items:center; gap:10px; padding:5px 0; border-top:1px dashed #33296a;}
.vocab-row:first-of-type{border-top:0;}
.vocab-row b{font-family:var(--f-story); font-weight:600; font-size:18px; min-width:110px;}
.vocab-row span{flex:1; font-size:16px;}
.speak{border:0; background:none; cursor:pointer; font-size:18px; padding:2px 6px; opacity:.8;}
.speak:hover{opacity:1;}
.grammar{margin-top:14px; padding:12px 14px; background:rgba(79,240,224,.08); --edge:var(--rune); font-size:16px;}
.grammar b{color:var(--rune); font-weight:500;}
.ending-banner{text-align:center; margin:16px 0 4px;}
.ending-banner .t{font-family:var(--f-pixel); font-size:32px; font-weight:700;}
.ending-banner.win .t{color:var(--gold); text-shadow:3px 3px 0 #8a5a00;}
.ending-banner.lose .t{color:var(--blood); text-shadow:3px 3px 0 #5a0018;}
.ending-banner p{color:var(--ink-dim); font-size:15px; margin:4px 0 0;}
.status{display:flex; align-items:center; gap:10px; color:var(--ink-dim); font-size:16px; margin:14px 4px;}
.spinner{width:14px; height:14px; background:var(--ember); animation:spin .9s steps(4) infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.err{padding:12px 14px; margin:14px 3px; --edge:var(--blood); background:rgba(255,77,109,.1); font-size:16px;}
.err .btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.story-card{display:flex; gap:14px; align-items:center; padding:12px; cursor:pointer; border:0; width:calc(100% - 6px); text-align:left; background:var(--panel); margin-bottom:12px;}
.story-card canvas{width:120px; height:68px; image-rendering:pixelated; flex:none; background:#000;}
.story-card h4{margin:0; font-size:18px; font-weight:500;}
.story-card p{margin:3px 0 0; font-size:12.5px; color:var(--ink-dim);}
.story-card .endc{font-family:var(--f-pixel); font-size:14px; color:var(--gold); margin-top:4px;}
.story-card.on{--edge:var(--ember);}

/* ---------- battle ---------- */
.arena{position:relative; height:250px; overflow:hidden; background:
  radial-gradient(ellipse 55% 45% at 50% 88%, rgba(226,112,90,.22), transparent 70%),
  linear-gradient(180deg,#122a33 0%,#1a3d42 60%,#112a2c 100%); --edge:var(--blood);}
.arena.boss{background:
  radial-gradient(ellipse 60% 50% at 50% 85%, rgba(232,196,119,.30), transparent 70%),
  linear-gradient(180deg,#173238 0%,#1f4a48 60%,#0f2828 100%); --edge:var(--gold);}
.arena-floor{position:absolute; left:0; right:0; bottom:0; height:46px; background:
  repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 2px, transparent 2px 24px), linear-gradient(180deg,#20444c,#112a2e); border-top:3px solid #3d6f6a;}
.arena.boss .arena-floor{background:repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 2px, transparent 2px 24px), linear-gradient(180deg,#1f4740,#102625); border-top-color:#4a7a68;}
.monster{position:absolute; left:50%; bottom:30px; transform:translateX(-50%); width:176px; height:176px; animation:bob 2.2s ease-in-out infinite;}
.arena.boss .monster{width:208px; height:208px; bottom:24px;}
.monster canvas{width:100%; height:100%; image-rendering:pixelated; display:block;}
.monster.wide{width:92%; height:auto; aspect-ratio:16/9; bottom:40px;}
.monster.hit canvas{animation:hitflash .35s steps(2) 1;}
.monster.dead{animation:die .8s forwards;}
@keyframes bob{0%,100%{transform:translate(-50%,0);}50%{transform:translate(-50%,-8px);}}
@keyframes hitflash{0%{filter:brightness(3) saturate(0);}100%{filter:none;}}
@keyframes die{to{transform:translate(-50%,30px) scale(.6); opacity:0; filter:brightness(3);}}
.mon-head{position:absolute; top:10px; left:12px; right:12px; display:flex; align-items:center; gap:10px;}
.mon-name{font-family:var(--f-pixel); font-size:17px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:55%;}
.mon-bar{flex:1; height:12px; background:var(--shadow); position:relative;}
.mon-bar i{position:absolute; inset:0 auto 0 0; background:linear-gradient(180deg,#ff8aa0,var(--blood)); transition:width .35s;}
.mon-bar u{position:absolute; inset:0 auto 0 0; background:#fff3; transition:width .9s .25s; text-decoration:none;}
.mon-hpnum{font-family:var(--f-pixel); font-size:14px; color:var(--ink-dim); min-width:58px; text-align:right;}
.floor-tag{position:absolute; top:34px; left:12px; font-family:var(--f-pixel); font-size:14px; color:var(--gold);}
.intent{position:absolute; top:34px; right:12px; font-size:14px; color:#ffb3c1;}
.dmg{position:absolute; left:50%; top:45%; font-family:var(--f-pixel); font-weight:700; font-size:34px; color:#fff; pointer-events:none; text-shadow:3px 3px 0 var(--shadow); animation:float 1s ease-out forwards; z-index:5; white-space:nowrap;}
.dmg.crit{font-size:46px; color:var(--gold);}
.dmg.heal{color:var(--leaf);}
.dmg.hurt{color:var(--blood);}
.dmg.mp{color:var(--rune);}
.dmg.tag{font-size:20px; color:var(--rune);}
@keyframes float{0%{transform:translate(-50%,0) scale(.6); opacity:0;}15%{transform:translate(-50%,-10px) scale(1.15); opacity:1;}100%{transform:translate(-50%,-70px) scale(1); opacity:0;}}
.combo{position:absolute; right:12px; bottom:56px; text-align:right; font-family:var(--f-pixel); line-height:1;}
.combo .n{font-size:39px; font-weight:700; color:var(--ember-hi); text-shadow:3px 3px 0 #a3321a;}
.combo .l{font-size:14px; color:var(--ember-hi);}
.combo.pop{animation:pop .25s;}
@keyframes pop{50%{transform:scale(1.3);}}
.shake{animation:shake .35s;}
@keyframes shake{20%{transform:translate(-6px,3px);}40%{transform:translate(5px,-4px);}60%{transform:translate(-4px,2px);}80%{transform:translate(3px,-1px);}}

.me-bars{display:grid; grid-template-columns:auto 1fr; gap:6px 10px; align-items:center; padding:12px 14px; margin-top:14px; background:var(--deep);}
.me-bars .who{grid-row:span 2; display:flex; align-items:center; gap:8px;}
.me-bars .who .e{font-size:34px; position:relative; width:38px; height:38px; display:inline-flex; align-items:center; justify-content:center; overflow:hidden;}
.me-bars .who .e img{width:100%; height:100%; object-fit:cover;}
.me-bars .who .e.shield::after{content:"🛡️"; position:absolute; right:-10px; bottom:-4px; font-size:18px;}
.bar{height:14px; background:var(--shadow); position:relative;}
.bar i{position:absolute; inset:0 auto 0 0; transition:width .35s;}
.bar.hp i{background:linear-gradient(180deg,#a6f5c6,var(--leaf));}
.bar.hp.low i{background:linear-gradient(180deg,#ff9fb0,var(--blood)); animation:blink 0.8s steps(1) infinite;}
.bar.mp i{background:linear-gradient(180deg,#b5fff8,var(--rune));}
.bar span{position:absolute; right:6px; top:50%; transform:translateY(-50%); font-family:var(--f-pixel); font-size:13px; color:#fff; text-shadow:1px 1px 0 #000;}

.qcard{margin-top:14px; padding:14px 16px; background:#efe7ff; color:#1c1540; --edge:#cbbcf7;}
.qcard .qmeta{display:flex; justify-content:space-between; font-size:14px; color:#6a5aa8; margin-bottom:6px;}
.qcard .qtype{font-weight:500;}
.qcard .prompt{font-family:var(--f-story); font-size:22px; line-height:1.45; font-weight:600;}
.qcard .prompt.thai{font-family:var(--f-ui); font-weight:500;}
.timer{height:6px; background:#d4c8f5; margin-top:10px; position:relative;}
.timer i{position:absolute; inset:0 auto 0 0; background:var(--ember);}
.timer.urgent i{background:var(--blood);}

.answers{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;}
@media (max-width:380px){ .answers{grid-template-columns:1fr;} }
.ans{cursor:pointer; border:0; text-align:left; padding:12px 12px; background:var(--panel); min-height:62px; display:flex; flex-direction:column; justify-content:center; width:calc(100% - 6px);}
.ans .w{font-family:var(--f-story); font-size:20px; font-weight:600; line-height:1.25;}
.ans .w.thai{font-family:var(--f-ui); font-weight:400; font-size:17px;}
.ans .sub{font-size:14px; color:var(--ink-dim); margin-top:2px;}
.ans .key{font-family:var(--f-pixel); font-size:13px; color:var(--ink-faint);}
.ans:hover:not(:disabled){--edge:var(--ember);}
.ans.ok{--edge:var(--leaf); background:#1d4a3a;}
.ans.no{--edge:var(--blood); background:#4a1d2c;}
.ans.gone{opacity:.18;}
.ans.truth{--edge:var(--gold);}
.ans:disabled{cursor:default;}

.actions{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
.skill{flex:1 1 0; min-width:64px; cursor:pointer; border:0; background:var(--deep); padding:8px 4px 6px; display:flex; flex-direction:column; align-items:center; gap:2px;}
.skill b{font-size:23px; font-weight:400; line-height:1.2;}
.skill span{font-size:13px; color:var(--ink-dim); white-space:nowrap;}
.skill em{font-style:normal; font-family:var(--f-pixel); font-size:13px; color:var(--rune);}
.skill em.item{color:var(--gold);}
.skill:disabled{opacity:.35; cursor:default;}
.skill:hover:not(:disabled){--edge:var(--rune);}
.reveal{margin-top:12px; padding:12px 14px; background:var(--deep); font-size:16px;}
.reveal .rw{font-family:var(--f-story); font-weight:600; font-size:20px;}
.reveal .rdef{color:var(--ink-dim); font-size:15px; margin-top:2px;}

/* ---------- overlay / modal ---------- */
.overlay{position:fixed; inset:0; z-index:80; background:rgba(8,5,20,.8); display:flex; align-items:center; justify-content:center; padding:20px; animation:fadein .2s;}
@keyframes fadein{from{opacity:0;}}
.modal{width:100%; max-width:400px; padding:22px 20px; text-align:center; background:var(--panel); max-height:90vh; overflow:auto;}
.modal .big{font-size:60px; line-height:1.1;}
.modal h2{font-family:var(--f-pixel); font-size:34px; margin:8px 0 4px; font-weight:700;}
.modal h2.win{color:var(--gold); text-shadow:3px 3px 0 #8a5a00;}
.modal h2.lose{color:var(--blood); text-shadow:3px 3px 0 #5a0018;}
.modal h2.lvl{color:var(--ember-hi); text-shadow:3px 3px 0 #a3321a;}
.modal p{color:var(--ink-dim); font-size:16px; margin:4px 0;}
.loot{display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin:16px 0;}
.loot div{background:var(--deep); padding:8px 12px; font-family:var(--f-pixel); font-size:17px;}
.modal .btn{margin-top:8px;}
.stat-ups{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:14px 0;}
.stat-ups div{background:var(--deep); padding:8px 4px; font-size:14px; color:var(--ink-dim);}
.stat-ups b{display:block; font-family:var(--f-pixel); font-size:21px; color:var(--leaf);}

/* ---------- challenge ---------- */
.ch-top{display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--deep);}
.ch-time{font-family:var(--f-pixel); font-size:41px; font-weight:700; color:var(--rune); min-width:64px;}
.ch-time.urgent{color:var(--blood);}
.ch-score{margin-left:auto; text-align:right; font-family:var(--f-pixel);}
.ch-score b{display:block; font-size:32px; color:var(--gold); line-height:1;}
.ch-score small{font-size:14px; color:var(--ink-dim);}
.ch-mult{font-family:var(--f-pixel); font-size:18px; color:var(--ember-hi);}
.bump{position:fixed; left:50%; top:40%; transform:translateX(-50%); font-family:var(--f-pixel); font-weight:700; font-size:30px; pointer-events:none; z-index:70; animation:float 0.9s ease-out forwards; text-shadow:3px 3px 0 var(--shadow);}

/* ---------- library ---------- */
.lib-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.lib-stats div{background:var(--deep); padding:10px 8px; text-align:center; font-size:14px; color:var(--ink-dim);}
.lib-stats b{display:block; font-family:var(--f-pixel); font-size:28px; color:var(--ink); font-weight:600;}
.word-row{display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--deep); margin-bottom:9px;}
.word-row .wm{flex:1; min-width:0;}
.word-row .ww{font-family:var(--f-story); font-weight:600; font-size:20px;}
.word-row .wp{font-size:14px; color:var(--ink-faint); margin-left:6px; font-family:var(--f-ui);}
.word-row .wt{font-size:16px; color:var(--ink-dim);}
.stars{font-size:13px; letter-spacing:1px; color:var(--gold); white-space:nowrap;}
.stars s{color:#3d3373; text-decoration:none;}
.due-dot{width:8px; height:8px; background:var(--ember); flex:none;}
.empty{text-align:center; color:var(--ink-dim); padding:30px 16px; font-size:16px;}
.flash{margin-top:14px; min-height:220px; padding:24px 18px; text-align:center; cursor:pointer; background:#efe7ff; color:#1c1540; --edge:#cbbcf7; display:flex; flex-direction:column; justify-content:center; align-items:center; border:0; width:calc(100% - 6px);}
.flash .fw{font-family:var(--f-story); font-size:39px; font-weight:600; line-height:1.2;}
.flash .fp{font-size:16px; color:#6a5aa8; margin-top:4px;}
.flash .ft{font-size:25px; font-weight:500; margin-top:14px;}
.flash .fd{font-family:var(--f-story); font-size:17px; color:#4b3f80; margin-top:6px; font-style:italic;}
.flash .hint{font-size:14px; color:#8a7cc2; margin-top:16px;}
.flash-btns{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;}

.hero-top{display:flex; gap:16px; align-items:center; padding:16px; background:var(--panel);}
.hero-top .e{font-size:62px; width:84px; height:84px; display:grid; place-items:center; background:var(--deep); flex:none; overflow:hidden;}

.hud-avatar img{width:100%; height:100%; object-fit:cover;}
.hero-top h2{margin:0; font-weight:500; font-size:23px;}
.hero-top p{margin:2px 0 0; color:var(--ink-dim); font-size:15px;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px;}
.stat-grid div{background:var(--deep); padding:10px 12px; display:flex; justify-content:space-between; align-items:center; font-size:15px; color:var(--ink-dim);}
.stat-grid b{font-family:var(--f-pixel); font-size:20px; color:var(--ink); font-weight:600;}
.ach-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.ach{padding:12px; background:var(--deep); --edge:#2e2663; opacity:.55;}
.ach.on{--edge:var(--gold); opacity:1; background:#2d2350;}
.ach .ai{font-size:30px; filter:grayscale(1);}
.ach.on .ai{filter:none;}
.ach .an{font-size:16px; font-weight:500; margin-top:4px;}
.ach .ad{font-size:14px; color:var(--ink-dim); line-height:1.4;}
.ach .ar{font-family:var(--f-pixel); font-size:14px; color:var(--gold); margin-top:4px;}
.avatar-row{display:flex; gap:10px; flex-wrap:wrap;}
.av{width:52px; height:52px; font-size:30px; border:0; cursor:pointer; background:var(--deep);}
.av.on{--edge:var(--ember); background:#3a2250;}
.shop-item{display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--deep); margin-bottom:10px;}
.shop-item .si{font-size:32px; width:40px; text-align:center; flex:none;}
.shop-item .sm{flex:1; min-width:0;}
.shop-item .sn{font-size:17px; font-weight:500;}
.shop-item .sd{font-size:12.5px; color:var(--ink-dim);}
.shop-item .own{font-family:var(--f-pixel); font-size:14px; color:var(--rune);}
.price{font-family:var(--f-pixel); font-size:17px;}
.tabs-inline{display:flex; gap:8px; margin:6px 0 14px;}

/* ---------- settings ---------- */
.set-row{padding:14px 16px; background:var(--deep); margin-bottom:12px;}
.set-row .sl{font-size:16px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;}
.set-row .sh{font-size:12.5px; color:var(--ink-dim); margin-top:6px;}
.toggle{width:52px; height:28px; background:var(--shadow); border:0; position:relative; cursor:pointer; flex:none;}
.toggle::after{content:""; position:absolute; top:4px; left:4px; width:20px; height:20px; background:var(--ink-faint); transition:left .15s, background .15s;}
.toggle.on::after{left:28px; background:var(--leaf);}
.color-in{width:52px; height:36px; border:0; background:none; padding:0; cursor:pointer;}
.color-in::-webkit-color-swatch-wrapper{padding:0;} .color-in::-webkit-color-swatch{border:2px solid var(--edge);}
.avatar-upload{width:84px; height:84px; flex:none; border-radius:0; overflow:hidden; position:relative; cursor:pointer; background:var(--deep);}
.avatar-upload img{width:100%; height:100%; object-fit:cover; image-rendering:pixelated;}
.avatar-upload .up-badge{position:absolute; right:2px; bottom:2px; background:var(--panel-2); font-size:13px; padding:2px 4px; --edge:var(--edge);}
.hud-avatar img{width:100%; height:100%; object-fit:cover;}
input[type=range]{width:100%; accent-color:var(--ember);}
.ai-dot{display:inline-block; width:9px; height:9px; margin-right:6px;}
.ai-dot.online{background:var(--leaf);} .ai-dot.offline{background:var(--ink-faint);} .ai-dot.unknown{background:var(--gold);}
textarea.text-in{min-height:80px; resize:vertical; font-size:14px; font-family:monospace;}

/* ---------- toast ---------- */
.toasts{position:fixed; top:calc(70px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); z-index:90; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:max-content; max-width:92vw;}
.toast{background:var(--panel-2); --edge:var(--gold); padding:9px 16px; font-size:16px; animation:toastin .25s, fade .4s 2.6s forwards;}
@keyframes toastin{from{transform:translateY(-10px); opacity:0;}}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important; animation-iteration-count:1 !important; transition:none !important;}
  .monster{animation:none;}
}

function mergeDeep(base, extra){
  for(const k in extra){
    if(extra[k] && typeof extra[k]==='object' && !Array.isArray(extra[k]) && base[k] && typeof base[k]==='object' && !Array.isArray(base[k])) mergeDeep(base[k], extra[k]);
    else base[k] = extra[k];
  }
  return base;
}
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw) return mergeDeep(defaultSave(), JSON.parse(raw));
    const old = localStorage.getItem(OLD_SAVE_KEY);
    if(old){ // migrate v1 progress
      const o = JSON.parse(old), s = defaultSave();
      s.onboarded = !!o.onboarded; s.name = o.name || s.name; s.avatar = o.avatar || s.avatar;
      s.cefr = o.cefr || s.cefr; s.level = o.level || 1; s.gold = o.gold || s.gold;
      s.achievements = o.achievements || {};
      Object.values(o.vocab||{}).forEach(v=>{ s.vocab[v.word.toLowerCase()] = { word:v.word, thai:v.thai||'', pron:'', def:'', count:v.count||1, mastery:0, due:0 }; });
      if(o.avatar && !Object.values(CLASSES).some(c=>c.emoji===o.avatar)) s.ownedAvatars.push(o.avatar);
      return s;
    }
  }catch(e){}
  return defaultSave();
}

/* --------------------------- custom theme color --------------------------- */
const DEFAULT_ACCENT = '#ff9d5c';
function shadeHex(hex, amt){ // amt: -1..1, negative darkens, positive lightens
  const n = hex.replace('#',''); const num = parseInt(n.length===3 ? n.split('').map(c=>c+c).join('') : n, 16);
  let r = (num>>16)&255, g = (num>>8)&255, b = num&255;
  const f = amt<0 ? amt+1 : amt, t = amt<0 ? 0 : 255;
  r = Math.round((t-r)*f)+r; g = Math.round((t-g)*f)+g; b = Math.round((t-b)*f)+b;
  return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');
}
function avatarInner(){ const img = save.settings && save.settings.avatarImg; return img ? `<img src="${img}" alt="avatar">` : save.avatar; }
function applyTheme(){
  const c = (save.settings && save.settings.themeColor) || DEFAULT_ACCENT;
  const root = document.documentElement.style;
  root.setProperty('--ember', c);
  root.setProperty('--ember-hi', shadeHex(c, .35));
  const meta = document.querySelector('meta[name=theme-color]'); if(meta) meta.setAttribute('content', c);
}

/* --------------------------- derived stats --------------------------- */
function xpNeeded(level){ return Math.round(100 * Math.pow(1.22, level-1)); }
function equipBonus(){
  const tot = { hp:0, mp:0, atk:0, crit:0 };
  const eq = (save.equipped)||{};
  Object.values(eq).forEach(id=>{ const it = id && EQUIPMENT[id]; if(!it) return;
    Object.entries(it.bonus).forEach(([k,v])=>{ tot[k] = (tot[k]||0) + v; }); });
  return tot;
}
function playerStats(){
  const c = CLASSES[save.cls] || CLASSES.warrior, L = save.level-1, u = save.upgrades, eq = equipBonus();
  return {
    maxHp: c.hp + L*8 + u.hp*15 + eq.hp,
    maxMp: c.mp + L*3 + u.mp*10 + eq.mp,
    atk: c.atk + L*2 + u.atk*3 + eq.atk,
    crit: c.crit + eq.crit,
  };
}
function todayStr(d){ const x = d || new Date(); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }

/* ------------------------ rewards / progression ------------------------ */
const pendingEvents = []; // level-ups and achievements shown after the current moment
function addXp(n){
  if(n<=0) return;
  save.xp += n;
  while(save.xp >= xpNeeded(save.level)){
    const before = playerStats();
    save.xp -= xpNeeded(save.level);
    save.level += 1;
    const after = playerStats();
    pendingEvents.push({ type:'level', level:save.level, hp:after.maxHp-before.maxHp, mp:after.maxMp-before.maxMp, atk:after.atk-before.atk });
    sfx.level();
  }
  persist();
}
function addGold(n){ if(n<=0) return; save.gold += n; save.stats.goldEarned += n; persist(); }
function bump(key, n){
  n = n===undefined ? 1 : n;
  if(key in save.stats) save.stats[key] += n;
  save.daily.counters[key] = (save.daily.counters[key]||0) + n;
  persist();
}
function bumpMax(key, value){
  if(value > (save.stats[key]||0)) save.stats[key] = value;
  if(value > (save.daily.counters[key]||0)) save.daily.counters[key] = value;
  persist();
}

/* ------------------------------ vocab / SRS ------------------------------ */
function vkey(w){ return String(w||'').trim().toLowerCase(); }
function learnWord(w){
  const key = vkey(w.word); if(!key) return null;
  let v = save.vocab[key];
  if(!v){ v = save.vocab[key] = { word:w.word.trim(), thai:w.thai||'', pron:w.pron||'', def:w.def||'', count:0, mastery:0, due:Date.now() }; }
  v.count += 1;
  if(w.thai) v.thai = w.thai; if(w.pron && !v.pron) v.pron = w.pron; if(w.def && !v.def) v.def = w.def;
  persist();
  return v;
}
function grade(key, good){
  const v = save.vocab[key]; if(!v) return;
  if(good){ v.mastery = Math.min(5, v.mastery+1); v.due = Date.now() + SRS_HOURS[v.mastery]*HOUR; }
  else { v.mastery = Math.max(0, v.mastery-1); v.due = Date.now() + 10*60000; }
  persist();
}
function vocabList(){ return Object.entries(save.vocab).map(([k,v])=>Object.assign({key:k}, v)); }
function dueWords(){ const now = Date.now(); return vocabList().filter(v=>v.due<=now); }
function masteredCount(){ return vocabList().filter(v=>v.mastery>=4).length; }

function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function ensureDaily(){
  const t = todayStr();
  if(save.daily.date === t) return;
  const rng = mulberry(hashStr(t));
  const pool = DAILY_POOL.slice().filter(q=>q.id!=='boss1' || save.stats.bestFloor>=3);
  const picks = [];
  while(picks.length<3 && pool.length){ picks.push(pool.splice(Math.floor(rng()*pool.length),1)[0].id); }
  save.daily = { date:t, quests:picks.map(id=>({ id, claimed:false })), counters:{} };
  // login streak
  const y = todayStr(new Date(Date.now()-DAY));
  save.streak.days = save.streak.last===y ? save.streak.days+1 : 1;
  save.streak.last = t;
  const bonus = 10 + Math.min(save.streak.days,7)*5;
  save.gold += bonus;
  persist();
  if(save.onboarded) setTimeout(()=>toast(`🔥 เข้าเล่นต่อเนื่อง ${save.streak.days} วัน · รับ ${bonus} ทอง`), 600);
}
function questInfo(q){
  const d = DAILY_POOL.find(x=>x.id===q.id);
  const p = Math.min(d.target, save.daily.counters[d.key]||0);
  return Object.assign({}, d, { progress:p, done:p>=d.target, claimed:q.claimed });
}

/* ------------------------------ RNG ------------------------------ */
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function pick(arr, rng){ return arr[Math.floor((rng||Math.random)()*arr.length)]; }
function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function rint(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }

/* ------------------------------ audio ------------------------------ */
let audioCtx = null, musicTimer = null;
function ctxA(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
function tone(freq, dur, type, vol, delay){
  const v = (save.settings.sfx/100) * (vol||0.12);
  if(v<=0) return;
  const ctx = ctxA(); if(!ctx) return;
  const t0 = ctx.currentTime + (delay||0);
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type||'square'; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0+dur+0.02);
}
function slide(f1, f2, dur, type, vol){
  const v = (save.settings.sfx/100)*(vol||0.1); if(v<=0) return;
  const ctx = ctxA(); if(!ctx) return; const t0 = ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type||'square';
  o.frequency.setValueAtTime(f1,t0); o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(v,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0+dur+0.02);
}

/* ------------------------------ speech ------------------------------ */
function speak(text){
  if(!save.settings.tts || !('speechSynthesis' in window) || !text) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = .88;
    const v = speechSynthesis.getVoices().find(x=>/en[-_]US/i.test(x.lang)) || speechSynthesis.getVoices().find(x=>/^en/i.test(x.lang));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------------------- procedural monsters ---------------------- */
const MON_PALETTES = [
  ['#1a0f14','#6b1f3a','#c43d5c','#ff7a9a','#ffe14f'],
  ['#0f1a14','#1f5a3a','#3fae6a','#9af0b0','#ff5a5a'],
  ['#0f1020','#2a2e7a','#4f5ad6','#9aa6ff','#ffd166'],
  ['#1a120a','#6a3a12','#c0762a','#ffc27a','#6ef0ff'],
  ['#140f20','#4a2a7a','#8a4fd6','#d0a6ff','#7aff8a'],
  ['#0f1818','#1f5a5a','#2ec4b6','#a6fff6','#ff4d6d'],
  ['#1a1a1a','#4a4a4a','#8a8a8a','#e0e0e0','#ff3030'],
];
const MON_PRE = ['Gloom','Ember','Frost','Rot','Hex','Murk','Grim','Thorn','Void','Ash','Bog','Rune','Skull','Moss','Storm','Blight','Dread','Cinder'];
const MON_SUF = ['maw','fang','wing','shade','golem','crawler','wyrm','imp','hound','slime','eye','beast','wraith','spawn','horn','claw'];
const BOSS_TITLES = ['the Relentless','the Cunning','the Formidable','the Treacherous','the Ominous','the Eerie','the Hostile','the Tenacious'];
function genMonster(seed, boss){
  const rng = mulberry(seed);
  const N = 16, half = 8, grid = Array.from({length:N},()=>Array(N).fill(0));
  const rx = 4.5 + rng()*3, ry = 5 + rng()*2.5, cy = 8 + (rng()-.5)*1.5;
  for(let y=0;y<N;y++) for(let x=0;x<half;x++){
    const dx = (7.5-x)/rx, dy = (y-cy)/ry, d = Math.sqrt(dx*dx+dy*dy);
    if(rng() < 1.25 - d*1.05) grid[y][x] = 1;
  }
  for(let y=Math.round(cy-ry*.6); y<=Math.round(cy+ry*.7); y++) if(y>=0&&y<N){ grid[y][7]=1; grid[y][6]=1; }
  // smoothing pass
  const g2 = grid.map(r=>r.slice());
  for(let y=1;y<N-1;y++) for(let x=1;x<half;x++){ let n=0; [[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{ const xx = x+a>7 ? 7-(x+a-8) : x+a; n+=grid[y+b][xx]||0; }); if(n>=3) g2[y][x]=1; if(n<=1) g2[y][x]=0; }
  // limbs
  if(rng()<.7){ const ly = Math.round(cy+ry*.5); for(let i=0;i<3;i++){ const yy=Math.min(N-1,ly+i); const xx=Math.max(0, 7-Math.round(rx*.6)-i%2); g2[yy][xx]=1; } }
  if(rng()<.5){ const ay = Math.round(cy); for(let i=0;i<3;i++){ const xx = Math.max(0, 7-Math.round(rx)-i+1); if(ay-i>=0) g2[ay-i][xx]=1; } }
  // horns
  if(boss || rng()<.35){ const top = g2.findIndex(r=>r.some(v=>v)); const hx = 7-Math.round(rx*.45); for(let i=1;i<=(boss?3:2);i++){ if(top-i>=0) g2[top-i][Math.max(0,hx-i+1)]=2; } }
  // mirror
  const full = g2.map(r=>{ const h = r.slice(0,half); return h.concat(h.slice().reverse()); });
  const pal = pick(MON_PALETTES, rng);
  const eyeY = Math.max(1, Math.round(cy - ry*.25)), cyclops = rng()<.3;
  const eyes = cyclops ? [[7,eyeY],[8,eyeY]] : [[7-1-Math.floor(rng()*2),eyeY]];
  if(!cyclops) eyes.push([15-eyes[0][0], eyeY]);
  const mouthY = Math.min(N-2, eyeY + 3 + (rng()<.5?1:0)), mouthW = 1+Math.floor(rng()*3);
  return { grid:full, pal, eyes, cyclops, mouthY, mouthW, boss };
}
function drawMonster(canvas, m){
  const N = 16, S = 18; canvas.width = S; canvas.height = S;
  const c = canvas.getContext('2d'); c.clearRect(0,0,S,S);
  const [outline, dark, main, light, eyeCol] = m.pal;
  const at = (x,y)=> (y>=0&&y<N&&x>=0&&x<N) ? m.grid[y][x] : 0;
  for(let y=-1;y<=N;y++) for(let x=-1;x<=N;x++){
    if(at(x,y)) continue;
    if(at(x+1,y)||at(x-1,y)||at(x,y+1)||at(x,y-1)){ c.fillStyle = outline; c.fillRect(x+1,y+1,1,1); }
  }
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const v = at(x,y); if(!v) continue;
    let col = main; if(v===2) col = m.boss ? '#ffd166' : light; else if(!at(x,y-1)) col = light; else if(!at(x,y+1)) col = dark;
    c.fillStyle = col; c.fillRect(x+1,y+1,1,1);
  }
  m.eyes.forEach(([x,y])=>{ if(at(x,y)){ c.fillStyle='#ffffff'; c.fillRect(x+1,y+1,1,1); c.fillStyle=eyeCol; if(m.cyclops){ c.fillRect(x+1,y+2,1,1);} else c.fillRect(x+1,y+2,1,1); } });
  for(let i=0;i<m.mouthW;i++){ [7-i,8+i].forEach(x=>{ if(at(x,m.mouthY)){ c.fillStyle = outline; c.fillRect(x+1,m.mouthY+1,1,1); if(i===m.mouthW-1){ c.fillStyle='#ffffff'; c.fillRect(x+1,m.mouthY+1,1,1);} } }); }
}
function monsterName(seed, boss){
  const r = mulberry(seed*7+3);
  const n = pick(MON_PRE,r) + pick(MON_SUF,r);
  return boss ? n + ' ' + pick(BOSS_TITLES,r) : n;
}

   QUESTIONS — built-in generator
   ====================================================================== */
function levelPool(){
  const lv = save.cefr;
  if(lv==='A2') return WORD_BANK.A2.concat(WORD_BANK.B1.slice(0,10));
  if(lv==='B1') return WORD_BANK.B1.concat(WORD_BANK.A2.slice(0,12), WORD_BANK.B2.slice(0,8));
  return WORD_BANK.B2.concat(WORD_BANK.B1.slice(0,15));
}
const QTYPES = { def:'ความหมายนี้คือคำไหน?', th2en:'คำไหนแปลว่า…', en2th:'คำนี้แปลว่าอะไร?' };
function wordFromVocab(v){ const b = ALL_WORDS.find(w=>w.word.toLowerCase()===v.key); return b || (v.thai ? { word:v.word, pron:v.pron||'', thai:v.thai, def:v.def||'' } : null); }
function makeQuestion(recent){
  const pool = levelPool();
  let word = null;
  const due = dueWords().filter(v=>!recent.has(v.key)).map(wordFromVocab).filter(Boolean);
  if(due.length && Math.random()<.3) word = pick(due);
  let tries = 0;
  while(!word || (recent.has(vkey(word.word)) && tries<30)){ word = pick(pool); tries++; }
  recent.add(vkey(word.word)); if(recent.size>18){ recent.delete(recent.values().next().value); }
  let type = pick(word.def ? ['def','def','th2en','en2th'] : ['th2en','en2th']);
  const others = shuffle((pool.length>6?pool:ALL_WORDS).filter(w=>w.word!==word.word && w.thai!==word.thai)).slice(0,3);
  const opts = shuffle([word].concat(others));
  const correct = opts.indexOf(word);
  let prompt, promptThai=false, options;
  if(type==='def'){ prompt = word.def; options = opts.map(o=>({ text:o.word, sub:o.pron, thai:false, after:o.thai })); }
  else if(type==='th2en'){ prompt = word.thai; promptThai = true; options = opts.map(o=>({ text:o.word, sub:o.pron, thai:false, after:o.thai })); }
  else { prompt = word.word; options = opts.map(o=>({ text:o.thai, sub:'', thai:true, after:o.word })); }
  return { type, label:QTYPES[type], prompt, promptThai, options, correct, word };
}

function runTyping(){

  const key = el.dataset.type; if(key===typedKey || matchMedia('(prefers-reduced-motion: reduce)').matches){ typedKey = key; return; }

const STOP = new Set('i the a an to and of in on at my me you it is will go for with into from up out now then'.split(' '));
function tokens(s){ return String(s).toLowerCase().replace(/[^a-z\s']/g,' ').split(/\s+/).filter(w=>w && !STOP.has(w)); }
function matchOption(text, opts){
  const t = tokens(text); let best = -1, bestScore = 0;
  opts.forEach((o,i)=>{ const ot = tokens(o); let s = 0; t.forEach(w=>{ if(ot.includes(w)) s += 2; else if(w.length>=4 && ot.some(x=>x.startsWith(w.slice(0,4)))) s += 1; }); if(s>bestScore){ bestScore=s; best=i; } });
  return best<0 ? { idx:Math.floor(Math.random()*opts.length), score:0 } : { idx:best, score:bestScore };
}
function grammarCheck(text){
  const notes = [], s = text.trim();
  if(/^[a-z]/.test(s)) notes.push('ขึ้นต้นประโยคด้วยตัวพิมพ์ใหญ่ เช่น “'+s.charAt(0).toUpperCase()+s.slice(1,20)+'…”');
  if(/(^|\s)i(\s|'|$)/.test(s)) notes.push('สรรพนาม “I” ต้องเป็นตัวพิมพ์ใหญ่เสมอ');
  const an = s.match(/\ba ([aeiou]\w*)/i); if(an && !/^(uni|use|usu|one|euro)/i.test(an[1])) notes.push(`ใช้ “an” หน้าคำที่ขึ้นต้นด้วยเสียงสระ: “an ${an[1]}”`);
  const v3 = s.match(/\b(he|she|it)\s+(go|do|have|want|walk|run|take|say|look|try|need|like|know|see|come|make|find|open|ask|help|climb|swim)\b/i);
  if(v3) notes.push(`ประธาน ${v3[1]} ใช้กริยาเติม s/es (Present Simple): “${v3[1]} ${v3[2]==='have'?'has':v3[2]==='do'?'does':v3[2]==='go'?'goes':v3[2]==='try'?'tries':v3[2]+'s'}”`);
  const i3 = s.match(/\bI\s+(goes|does|has|wants|walks|runs|takes|says|looks|needs|likes)\b/); if(i3) notes.push(`หลัง “I” ใช้กริยารูปปกติ ไม่เติม s`);
  const modal = s.match(/\b(can|will|should|must|could|would)\s+to\s+(\w+)/i); if(modal) notes.push(`หลัง ${modal[1]} ใช้กริยาช่องที่ 1 โดยไม่มี to: “${modal[1]} ${modal[2]}”`);
  const modal2 = s.match(/\b(can|will|should|must)\s+(goes|went|going|takes|took|runs|ran)\b/i); if(modal2) notes.push(`หลัง ${modal2[1]} ใช้กริยารูปพื้นฐาน (base form)`);
  if(/\s{2,}/.test(s)) notes.push('มีการเว้นวรรคซ้ำ');
  if(!/[.!?]$/.test(s) && s.split(/\s+/).length>=3) notes.push('จบประโยคด้วยเครื่องหมาย . ! หรือ ?');
  if(s.split(/\s+/).length<3) notes.push('ลองเขียนเป็นประโยคเต็ม มีประธาน + กริยา เช่น “I open the door.”');
  return notes.length ? notes.map(n=>'• '+n).join('\n') : '✓ ไม่พบข้อผิดพลาดที่ชัดเจน เขียนได้ดี!';
}
function chooseStory(i, freeText){

function submitFree(){

}

function answerBattle(i){

/* ------------------------------ word blitz ------------------------------ */
function startBlitz(){
  ui.ch = { end:Date.now()+60000, score:0, combo:0, correct:0, wrong:0, recent:new Set(), answered:null, running:true, left:60 };
  ui.ch.q = makeQuestion(ui.ch.recent);
  goto('challenge');
  const ch = ui.ch;
  ch.timer = setInterval(()=>{
    if(ui.screen!=='challenge'){ clearInterval(ch.timer); return; }
    const left = Math.max(0, ch.end-Date.now()); ch.left = left/1000;
    const el = $('#chTime'); if(el){ el.textContent = Math.ceil(ch.left); el.classList.toggle('urgent', ch.left<10); }
    if(left<=0) finishBlitz();
  }, 100);
}
function answerBlitz(i){
  const ch = ui.ch; if(!ch || !ch.running || ch.answered!==null) return;
  const q = ch.q, ok = i===q.correct; ch.answered = i;
  learnWord(q.word); grade(vkey(q.word.word), ok);
  if(ok){
    ch.combo++; ch.correct++; bump('correct');
    const mult = 1 + Math.min(ch.combo,20)*0.1, pts = Math.round(10*mult); ch.score += pts;
    fxBump('+'+pts, 'var(--gold)'); sfx.hit();
    if(ch.combo%5===0){ ch.end += 3000; setTimeout(()=>fxBump('+3s ⏱', 'var(--rune)'), 250); sfx.coin(); }
  } else { ch.combo = 0; ch.wrong++; ch.end -= 3000; fxBump('-3s', 'var(--blood)'); sfx.wrong(); }
  render();
  setTimeout(()=>{ if(ui.ch===ch && ch.running){ ch.q = makeQuestion(ch.recent); ch.answered = null; render(); } }, ok?320:1100);
}
function finishBlitz(){
  const ch = ui.ch; if(!ch || !ch.running) return;
  ch.running = false; clearInterval(ch.timer);
  const xp = Math.round(ch.score/12)+5, gold = Math.round(ch.score/25)+3, best = ch.score > save.stats.bestChallenge;
  addXp(xp); addGold(gold); bump('challengesCompleted'); bumpMax('bestChallenge', ch.score);
  sfx.victory(); checkAchievements();
  openModal(`<div class="big">⚡</div><h2 class="win">${ch.score}</h2><p>${best?'สถิติใหม่!':'คะแนนสูงสุด '+save.stats.bestChallenge}</p>
    <div class="loot"><div>ถูก ${ch.correct}</div><div>ผิด ${ch.wrong}</div><div>✨ +${xp}</div><div>🪙 +${gold}</div></div>
    <button class="btn primary px block" data-act="blitz">เล่นอีกรอบ</button><button class="btn ghost px block" data-act="toHub">กลับเมือง</button>`, { sticky:true });
  flushEvents();
}
function renderChallenge(){
  const ch = ui.ch, q = ch.q;
  const ans = q.options.map((o,i)=>{
    let cls = 'ans px'; if(ch.answered!==null){ if(i===q.correct) cls+=' ok'; else if(i===ch.answered) cls+=' no'; }
    return `<button class="${cls}" data-act="chAns" data-i="${i}" ${ch.answered!==null||!ch.running?'disabled':''}><span class="key">${i+1}</span><span class="w ${o.thai?'thai':''}">${esc(o.text)}</span>${o.sub?`<span class="sub">${esc(o.sub)}</span>`:''}</button>`;
  }).join('');
  return `<button class="back" data-act="chQuit">← ออก</button>
  <div class="ch-top px"><div class="ch-time pixel ${ch.left<10?'urgent':''}" id="chTime">${Math.ceil(ch.left)}</div>
    <div><div class="ch-mult">×${(1+Math.min(ch.combo,20)*0.1).toFixed(1)}</div><div style="font-size:14px;color:var(--ink-dim);">คอมโบ ${ch.combo} · ทุก 5 คอมโบ +3 วิ</div></div>
    <div class="ch-score"><b>${ch.score}</b><small>คะแนน</small></div></div>
  <div class="qcard px"><div class="qmeta"><span class="qtype">${esc(q.label)}</span><span>ผิด −3 วินาที</span></div>
    <div class="prompt ${q.promptThai?'thai':''}">${esc(q.prompt)}</div></div>
  <div class="answers">${ans}</div>`;
}

function rateCard(good){
  const r = ui.review; if(!r || !r.flipped) return;

    openModal(`<div class="big">🃏</div><h2 class="win">DONE</h2><p>จำได้ ${r.good} จาก ${r.keys.length} คำ · +${r.keys.length*2} XP</p>

      <input type="color" class="color-in" data-input="themeColor" value="${st.themeColor||DEFAULT_ACCENT}" aria-label="สีธีม">
      <button class="chip px" data-act="resetTheme">${T('th')?'ค่าเริ่มต้น':'Reset'}</button>
    </div>
    <div class="sh">${T('th')?'เลือกสีอะไรก็ได้ ระบบจะปรับโทนสีหลักของเว็บให้ทันที':'Pick any color — the site accent updates instantly'}</div></div>
  <div class="set-row px"><div class="sl"><span>${t('sfxVol')}</span><span class="pixel" id="sfxVal">${st.sfx}%</span></div><input type="range" min="0" max="100" value="${st.sfx}" data-input="sfx" aria-label="${t('sfxVol')}"></div>
  ${tg('music',t('music'),t('musicHint'))}
  ${tg('tts',t('tts'),t('ttsHint'))}
  ${tg('autoSpeak',t('autoSpeak'),t('autoSpeakHint'))}
  <div class="set-row px"><div class="sl"><span>${t('backup')}</span></div>
    <div class="chips"><button class="chip px" data-act="exportSave">${t('copySave')}</button><button class="chip px" data-act="importOpen">${t('importSave')}</button></div>
    ${ui.exportCode?`<textarea class="text-in px" style="margin-top:12px;" readonly>${esc(ui.exportCode)}</textarea>`:''}
    <div class="sh">${t('backupHint')}</div></div>
  <button class="btn danger px block" data-act="resetAsk">${t('resetAll')}</button>
  <p style="text-align:center;font-size:14px;color:var(--ink-faint);margin-top:18px;">Quest Lines v2 · เล่นได้ฟรี ไม่ต้องใช้เน็ต</p>`;
}

/* ======================================================================
   ACTIONS
   ====================================================================== */
function act(a, d){
  if(!['ans','chAns','flip','rate','speak'].includes(a)) sfx.click();
  switch(a){
    case 'overlayBg': break;
    case 'closeModal': closeModal(); break;
    case 'tab': if(ui.screen==='challenge' && ui.ch) ui.ch.running=false; goto(d.to); break;
    case 'toHub': ui.modals=[]; goto('hub'); break;
    case 'toLibrary': ui.modals=[]; goto('library'); break;
    case 'speak': speak(d.w); break;
    /* onboarding */
    case 'obCls': ui.onboard.cls = d.v; render(); break;
    case 'obCefr': ui.onboard.cefr = d.v; render(); break;
    case 'obStart':
      save.name = (ui.onboard.name||'').trim() || 'Traveler'; save.cls = ui.onboard.cls; save.avatar = CLASSES[save.cls].emoji;
      save.cefr = ui.onboard.cefr; save.onboarded = true; persist(); ensureDaily(); goto('hub');
      setTimeout(()=>toast('ยินดีต้อนรับ! เริ่มจาก Monster Tower ได้เลย'), 300); break;
    /* hub */
    case 'claim': { const q = save.daily.quests.find(x=>x.id===d.id), info = q && questInfo(q); if(info && info.done && !q.claimed){ q.claimed = true; addGold(info.gold); sfx.coin(); fxBump('+'+info.gold+' 🪙'); checkAchievements(); render(); flushEvents(); } break; }
    case 'towerMenu': towerMenu(); break;
    case 'goStory': ui.modals=[]; goto('story-pick'); break;
    case 'blitz': ui.modals=[]; startBlitz(); break;
    case 'review': startReview(); break;
    /* story */
    case 'storyStart': startOfflineStory(d.theme, false); flushEvents(); break;
    case 'storyResume': startOfflineStory(d.theme, true); break;
    case 'storyChoose': if(!ui.story.loading){ chooseStory(+d.i); flushEvents(); } break;
    case 'storyFree': if(!ui.story.loading){ submitFree(); flushEvents(); } break;
    case 'storyRewind': { const st = ui.story; if(st.history.length>1){ st.history.pop(); st.node = st.history[st.history.length-1]; st.correction=null; st.lastFree=null; save.storySave = { theme:st.theme, node:st.node, history:st.history.slice() }; persist(); typedKey = st.theme+':'+st.node; render(); } break; }
    case 'storyExit': goto('story-pick'); break;
    /* battle */
    case 'runStart': startRun(+d.floor); break;
    case 'ans': answerBattle(+d.i); break;
    case 'bNext': if(ui.battle && ui.battle.phase==='reveal'){ nextQ(); render(); } break;
    case 'skill': useSkill(d.k); break;
    case 'runNext': { const b = ui.battle, ps = playerStats(); closeModal(); b.floor++; b.run.hp = Math.min(ps.maxHp, b.run.hp+Math.round(ps.maxHp*.25)); b.run.mp = Math.min(ps.maxMp, b.run.mp+10); b.combo = b.combo; spawnMonster(); nextQ(); render(); startBattleTimer(); break; }
    case 'runLeave': ui.modals=[]; ui.battle = null; goto('hub'); break;
    case 'runRetry': ui.modals=[]; ui.battle = null; goto('hub'); towerMenu(); break;
    case 'bQuit': if(ui.battle && (ui.battle.phase==='won'||ui.battle.phase==='lost')){ goto('hub'); break; }
      openModal(`<div class="big">🏳️</div><h2 class="lose" style="font-size:28px;">ถอยออก?</h2><p>รอบนี้จะจบลง รางวัลที่ได้ไปแล้วยังอยู่ครบ</p>
        <button class="btn danger px block" data-act="runLeave">ถอยกลับเมือง</button><button class="btn px block" data-act="closeModal">สู้ต่อ</button>`); break;
    /* blitz */
    case 'chAns': answerBlitz(+d.i); break;
    case 'chQuit': if(ui.ch){ ui.ch.running=false; clearInterval(ui.ch.timer); } goto('hub'); break;
    /* library */
    case 'libFilter': ui.lib.filter = d.v; render(); break;
    case 'flip': if(!ui.review.flipped){ ui.review.flipped = true; sfx.flip(); render(); if(save.settings.autoSpeak) speak(save.vocab[ui.review.keys[ui.review.i]].word); } break;
    case 'rate': rateCard(d.g==='1'); break;
    /* shop */
    case 'shopTab': ui.shopTab = d.v; render(); break;
    case 'buyItem': { const it = ITEMS[d.k]; if(save.gold>=it.price){ save.gold -= it.price; save.items[d.k]++; persist(); sfx.coin(); toast(`ได้รับ ${it.ico} ${it.name}`); render(); } break; }
    case 'buyUp': { const u = UPGRADES[d.k], lv = save.upgrades[d.k], cost = u.base*(lv+1); if(lv<u.max && save.gold>=cost){ save.gold -= cost; save.upgrades[d.k]++; persist(); sfx.level(); toast(`${u.ico} ${u.name} ระดับ ${lv+1}`); render(); } break; }
    case 'buyAv': { const a = AVATAR_SHOP.find(x=>x.emoji===d.v); if(a && save.gold>=a.cost && !save.ownedAvatars.includes(a.emoji)){ save.gold -= a.cost; save.ownedAvatars.push(a.emoji); save.avatar = a.emoji; persist(); sfx.coin(); toast(`ปลดล็อก ${a.name} แล้ว`); render(); } break; }
    case 'setAvatar': save.avatar = d.v; persist(); render(); break;
    case 'goEquip': ui.shopTab = 'equip'; goto('shop'); break;
    case 'buyEquip': { const it = EQUIPMENT[d.k]; if(it && save.gold>=it.price && !save.ownedEquipment.includes(d.k)){ save.gold -= it.price; save.ownedEquipment.push(d.k); save.equipped[it.slot] = d.k; persist(); sfx.coin(); toast(`สวมใส่ ${it.ico} ${it.th} แล้ว`); render(); } break; }
    case 'setEquip': { const it = EQUIPMENT[d.v]; if(it && save.ownedEquipment.includes(d.v)){ save.equipped[it.slot] = (save.equipped[it.slot]===d.v) ? null : d.v; persist(); sfx.click(); render(); } break; }
    /* settings */
    case 'setCls': save.cls = d.v; if(Object.values(CLASSES).some(c=>c.emoji===save.avatar)) save.avatar = CLASSES[d.v].emoji; persist(); render(); break;
    case 'setCefr': save.cefr = d.v; persist(); render(); break;
    case 'setLang': save.settings.lang = d.v; persist(); render(); break;
    case 'toggle': save.settings[d.k] = !save.settings[d.k]; persist(); if(d.k==='music') setMusic(save.settings.music); if(d.k==='tts' && save.settings.tts) speak('Hello, hero!'); render(); break;
    case 'resetTheme': save.settings.themeColor = ''; applyTheme(); persist(); render(); break;
    case 'avatarPick': { const inp = $('#avatarFileInput'); if(inp) inp.click(); break; }
    case 'avatarClear': save.settings.avatarImg = ''; persist(); render(); break;
    case 'exportSave': try{ ui.exportCode = btoa(unescape(encodeURIComponent(JSON.stringify(save)))); navigator.clipboard && navigator.clipboard.writeText(ui.exportCode).then(()=>toast('คัดลอกรหัสเซฟแล้ว')).catch(()=>{}); }catch(e){} render(); break;
    case 'importOpen': openModal(`<h2 class="lvl" style="font-size:25px;">นำเข้าเซฟ</h2><p>วางรหัสเซฟ ความคืบหน้าปัจจุบันจะถูกแทนที่</p>
      <textarea class="text-in px" id="importBox" style="margin-top:12px;"></textarea><button class="btn primary px block" data-act="importDo">นำเข้า</button><button class="btn ghost px block" data-act="closeModal">ยกเลิก</button>`); break;
    case 'importDo': { try{ const data = JSON.parse(decodeURIComponent(escape(atob($('#importBox').value.trim())))); if(!data || data.v!==2) throw 0; save = mergeDeep(defaultSave(), data); persist(); ui.modals=[]; toast('นำเข้าเซฟเรียบร้อย'); goto('hub'); }catch(e){ toast('รหัสเซฟไม่ถูกต้อง ตรวจว่าคัดลอกมาครบ'); } break; }
    case 'resetAsk': openModal(`<div class="big">⚠️</div><h2 class="lose" style="font-size:25px;">ล้างทุกอย่าง?</h2><p>เลเวล ทอง คำศัพท์ ความสำเร็จ จะหายทั้งหมดและกู้คืนไม่ได้</p>
      <button class="btn danger px block" data-act="resetDo">ล้างความคืบหน้า</button><button class="btn px block" data-act="closeModal">ยกเลิก</button>`); break;
    case 'resetDo': try{ localStorage.removeItem(SAVE_KEY); localStorage.removeItem(OLD_SAVE_KEY); }catch(e){} save = defaultSave(); ui.modals=[]; ui.onboard = { name:'', cls:'warrior', cefr:'B1' }; setMusic(false); goto('onboarding'); break;
  }
}
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  if(el.dataset.act==='overlayBg' && e.target!==el) return;
  act(el.dataset.act, el.dataset, el);
});
document.addEventListener('input', e=>{
  const k = e.target.dataset && e.target.dataset.input; if(!k) return;
  const v = e.target.value;
  if(k==='obName') ui.onboard.name = v;
  if(k==='free' && ui.story) ui.story.free = v;
  if(k==='libq'){ ui.lib.q = v; renderLibList(); }
  if(k==='rename'){ save.name = v.trim() || 'Traveler'; persist(); }
  if(k==='sfx'){ save.settings.sfx = +v; persist(); const s = $('#sfxVal'); if(s) s.textContent = v+'%'; }
  if(k==='themeColor'){ save.settings.themeColor = v; applyTheme(); persist(); }
});
document.addEventListener('change', e=>{ if(e.target.dataset && e.target.dataset.input==='sfx') sfx.click(); if(e.target.dataset && e.target.dataset.input==='rename') render(); });
document.getElementById('avatarFileInput').addEventListener('change', e=>{
  const file = e.target.files && e.target.files[0]; e.target.value = '';
  if(!file) return;
  if(!file.type.startsWith('image/')){ toast(T('th')?'เลือกไฟล์รูปภาพเท่านั้น':'Please choose an image file'); return; }
  const reader = new FileReader();
  reader.onload = ev=>{
    const img = new Image();
    img.onload = ()=>{
      const size = 160;
      const canvas = document.createElement('canvas'); canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const s = Math.min(img.width, img.height);
      const sx = (img.width-s)/2, sy = (img.height-s)/2;
      ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
      try{
        save.settings.avatarImg = canvas.toDataURL('image/jpeg', .85);
        persist(); toast(T('th')?'อัปเดตรูปโปรไฟล์แล้ว':'Profile picture updated'); render();
      }catch(err){ toast(T('th')?'ตั้งรูปโปรไฟล์ไม่สำเร็จ':'Could not set profile picture'); }
    };
    img.onerror = ()=> toast(T('th')?'เปิดไฟล์รูปไม่สำเร็จ':'Could not read image');
    img.src = ev.target.result;
  };
  reader.onerror = ()=> toast(T('th')?'อ่านไฟล์ไม่สำเร็จ':'Could not read file');
  reader.readAsDataURL(file);
});
document.addEventListener('keydown', e=>{
  const typing = /INPUT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName);
  if(e.key==='Enter' && typing && document.activeElement.id==='freeIn'){ e.preventDefault(); if(ui.story && !ui.story.loading){ submitFree(); flushEvents(); } return; }
  if(typing || ui.modals.length) { if(ui.modals.length && e.key==='Escape' && !ui.modals[0].sticky) closeModal(); return; }
  const n = parseInt(e.key,10);
  if(ui.screen==='battle' && ui.battle){
    if(n>=1 && n<=4) answerBattle(n-1);
    if(e.key==='Enter' && ui.battle.phase==='reveal'){ nextQ(); render(); }
  } else if(ui.screen==='challenge' && ui.ch){ if(n>=1 && n<=4) answerBlitz(n-1); }
  else if(ui.screen==='story' && ui.story && !ui.story.loading){
    const idx = 'abc'.indexOf(e.key.toLowerCase()); const ok = n>=1&&n<=3 ? n-1 : idx;
    const sc = offlineScene();
    if(ok>=0 && sc && !sc.end && sc.options[ok]){ chooseStory(ok); flushEvents(); }
  } else if(ui.screen==='review' && ui.review){
    if(e.key===' '){ e.preventDefault(); act('flip', {}); }
    else if(ui.review.flipped && (e.key==='1'||e.key==='ArrowLeft')) rateCard(false);
    else if(ui.review.flipped && (e.key==='2'||e.key==='ArrowRight')) rateCard(true);
  }
});
document.addEventListener('pointerdown', function first(){ ctxA(); if(save.settings.music) setMusic(true); document.removeEventListener('pointerdown', first); });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) setMusic(false); else if(save.settings.music && audioCtx) setMusic(true); });

/* ------------------------------ background sky ------------------------------ */
function paintSky(){
  const c = $('#sky'); const W = 160, H = Math.round(160*innerHeight/Math.max(innerWidth,1)); c.width = W; c.height = H;
  const x = c.getContext('2d'); const rng = mulberry(7);
  const g = x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0e1f27'); g.addColorStop(.7,'#142b34'); g.addColorStop(1,'#1d3f45'); x.fillStyle=g; x.fillRect(0,0,W,H);
  for(let i=0;i<W*H/60;i++){ x.fillStyle = rng()<.15 ? '#cdeee6' : '#4d7a78'; x.fillRect(Math.floor(rng()*W), Math.floor(rng()*H*.8), 1, 1); }
  x.fillStyle = '#16323a'; for(let i=0;i<W;i++){ const y = H - 14 - Math.sin(i*.05)*6 - Math.sin(i*.13+2)*3; x.fillRect(i,y,1,H-y); }
  x.fillStyle = '#0f2429'; for(let i=0;i<W;i++){ const y = H - 6 - Math.sin(i*.09+1)*3; x.fillRect(i,y,1,H-y); }
}

/* ------------------------------ boot ------------------------------ */
applyTheme();
paintSky(); addEventListener('resize', paintSky);
if(save.onboarded) ensureDaily();
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  addEventListener('load', ()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
}
</script>
</body></html>
