/* ---- modals & toasts ---- */
.overlay{background:radial-gradient(ellipse at 50% 42%,rgba(14,28,70,.55),rgba(2,4,16,.9));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal{border-color:#6a5a2a;box-shadow:inset 0 0 0 1px rgba(10,16,40,.9),inset 0 0 0 2.5px rgba(245,201,106,.6),inset 0 0 40px rgba(127,227,245,.08),0 24px 60px rgba(0,0,0,.65)}
.modal h3{transform:none;letter-spacing:.6px;background:var(--moon-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #050a20) drop-shadow(0 0 12px rgba(127,227,245,.35))}
.modal h3::after{content:'';display:block;height:8px;margin:8px auto 2px;width:70%;background:
  radial-gradient(circle,var(--gold) 0 3px,transparent 3.5px) center/8px 8px no-repeat,
  linear-gradient(90deg,transparent,var(--gold) 30%,transparent 46%,transparent 54%,var(--gold) 70%,transparent) center/100% 1px no-repeat}
.modal h3.lose{background:linear-gradient(#ffd0d0,#ff7a7a);-webkit-background-clip:text;background-clip:text}
.modal p{color:var(--ink-dim)}
.toast{background:linear-gradient(180deg,rgba(24,38,86,.96),rgba(12,20,50,.96));border:1.5px solid #2b3f7a;box-shadow:inset 0 0 0 1.5px rgba(245,201,106,.35),0 8px 18px rgba(2,4,16,.55);border-radius:12px}
.pz-word span{background:#dfe8fa;color:#101a44;border:1.5px solid #0e1433}
.pz-word button{background:#050a1e;border-color:var(--moon2)}
.pz-word button.f{background:#dff8ff;color:#0a1a44;border-color:#0e1433}
.pz-keys button{background:linear-gradient(165deg,#fff,#dfe8fa);color:#101a44;border:1.5px solid #0e1433;box-shadow:0 4px 0 #0e1433}

/* ---- character art hooks ---- */
.rimf{filter:url(#moonrim)}
body.lowfx .rimf{filter:none}
.chapter .ch-foes svg{filter:drop-shadow(0 3px 3px rgba(2,4,16,.6))}
.sc9 .tstar{animation:twinkle2 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.clouds,.aurora,.shim{animation:none}}

/* title copy sits on a soft glass plate so it stays readable over the moon */
.t9 .quote{background:linear-gradient(180deg,rgba(6,14,44,.55),rgba(6,14,44,.72));border:1px solid rgba(245,201,106,.3);border-radius:12px;padding:8px 14px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);font-size:14.5px}
.t9 .quote::before,.t9 .quote::after{color:var(--gold)}
.tagline9{background:radial-gradient(ellipse at center,rgba(6,14,44,.6),transparent 72%);padding:6px 12px}

/* ---------------------------- Boomtos: hellfire ---------------------------- */
.rage-badge{margin-left:6px;flex-shrink:0;font:700 15px var(--hand);color:#fff4c0;padding:3px 9px;border-radius:999px;
  background:linear-gradient(180deg,#ff8a3a,#c8200a);border:1.5px solid #3a0804;box-shadow:0 0 12px rgba(255,90,20,.6),inset 0 1px 0 rgba(255,255,255,.4);text-shadow:0 1px 0 #3a0804;white-space:nowrap}
.rage-badge b{color:#fff;background:#3a0804;border-radius:6px;padding:0 5px;margin-left:3px}
.rage-badge.max,.rage-badge.low{animation:rageThrob .6s ease-in-out infinite alternate}
@keyframes rageThrob{to{box-shadow:0 0 24px rgba(255,90,20,.95),inset 0 1px 0 rgba(255,255,255,.4);transform:scale(1.06)}}
.hellult{position:absolute;inset:0;z-index:6;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:radial-gradient(ellipse at 50% 55%,rgba(255,80,10,.28),rgba(40,0,0,.78) 70%);animation:fadeIn .2s}
.hellult::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(100deg,transparent 0 40px,rgba(255,120,30,.08) 40px 44px);animation:sweep 1s linear}
.hellult.out{animation:fadeOut .4s forwards}
.hu-letters{display:flex;gap:4px}
.hu-letters span{font:400 clamp(40px,10vw,92px)/1 var(--mark);background:linear-gradient(180deg,#fffbe0,#ffd24a 35%,#ff6a1a 70%,#c8200a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(2px 0 0 #2a0402) drop-shadow(-2px 0 0 #2a0402) drop-shadow(0 3px 0 #2a0402) drop-shadow(0 0 18px #ff4a0a) drop-shadow(0 0 36px #ff2a0a);
  animation:huIn .45s cubic-bezier(.3,1.8,.5,1) both}
@keyframes huIn{from{transform:translateY(60px) scale(.2) rotate(-12deg);opacity:0}}
.hu-sub{font:500 clamp(14px,3vw,20px) var(--thai);color:#ffe7c0;letter-spacing:3px;text-shadow:0 0 12px #ff4a0a,0 2px 4px #000;animation:pop .4s .5s both}
.flash-hell{position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse,rgba(255,240,180,.85),rgba(255,90,20,.55) 40%,transparent 75%);animation:fadeOut .6s forwards}
.stage.hellmode .infuse{background:radial-gradient(ellipse at 30% 60%,rgba(255,60,10,.25) 10%,rgba(30,0,0,.75) 75%)}
.stage.hellmode .inf-title{color:#ffd24a;text-shadow:0 0 24px #ff3a0a,0 4px 0 #2a0402}
.hell-tag{display:block;font-style:normal;font-size:.55em;letter-spacing:8px;color:#ff8a3a;-webkit-text-stroke:1px #2a0402;text-shadow:0 0 14px #ff2a0a}
.godcut{position:absolute;inset:0;z-index:5;pointer-events:none;display:flex;align-items:flex-start;justify-content:center;padding-top:14%;animation:fadeOut 1.6s ease-in forwards}
.gc-ray{position:absolute;left:50%;top:-10%;width:180px;height:120%;margin-left:-90px;background:linear-gradient(180deg,var(--gc),transparent 85%);opacity:.35;filter:blur(8px);animation:pop .4s}
.gc-name{position:relative;text-align:center;font:400 clamp(30px,7vw,60px)/1 var(--mark);color:#fff;letter-spacing:4px;
  text-shadow:0 0 18px var(--gc),0 0 34px var(--gc),0 3px 0 #0a1238;-webkit-text-stroke:1.5px #0a1238;paint-order:stroke fill;animation:pop .45s both}
.gc-name span{display:block;font-size:.8em;-webkit-text-stroke:0}
.gc-name small{display:block;margin-top:6px;font:500 clamp(12px,2.6vw,16px) var(--thai);letter-spacing:.5px;-webkit-text-stroke:0;color:#fff;text-shadow:0 2px 6px #000}
.tray[class*="el-god_"]{--ac:#ffe7a0;--c2:#fffbe8}
.tray-msg[class*="el-god_"]{border-color:#f5c96a;color:#fff4c0}

/* ---------------------------- Endless Tower card ---------------------------- */
.tower-card{display:flex;align-items:center;gap:12px;padding:12px 16px;margin:18px 0;overflow:hidden;
  background:radial-gradient(ellipse 50% 90% at 12% 50%,rgba(127,227,245,.16),transparent 70%),var(--panel-grad)}
.tw-art{width:96px;height:96px;flex-shrink:0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.tw-body{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px}

html.pixel{--mark:'Kanit','Noto Sans Thai','Leelawadee UI',system-ui,sans-serif;--hand:'Kanit','Noto Sans Thai','Leelawadee UI',system-ui,sans-serif}
/* Kanit is lighter than the old display font at 400 — headings get a heavier weight */
.mark,h2.title,.logo,.topbar .name,.hero-card .st b{font-weight:600}
html.pixel :is(.panel,.cbtn,.tile,.tiles,.chip,.pill,.text-in,.toast,.ach,.acc-slot,.equip-box,.estats,.trait,.wordcard,.bigbtn,.bar,.bar i,.prog-b,.prog-b i,.mastery-bar,.tog,.seg,.seg button,.tray-msg,.boss-phase,.modal,.modal-box,.sheet,.item,.pic){border-radius:0 !important}
html.pixel .tog::after,html.pixel .tog::before{border-radius:0 !important}
html.pixel :is(.cbtn,.tile,.bigbtn,.chip,.seg button){box-shadow:0 4px 0 #050814 !important;image-rendering:pixelated}
html.pixel .tile:active,html.pixel .tile.sel{box-shadow:0 1px 0 #050814 !important}
.atk-pick{margin-top:12px}
.atk-pick .seg{display:flex;flex-wrap:wrap;gap:6px}
.atk-pick .seg button{flex:1 1 auto}
.atk-demo{display:block;width:100%;max-width:420px;height:auto;margin:8px auto 0;background:radial-gradient(ellipse at 50% 90%,rgba(127,227,245,.12),transparent 60%)}
/* ---------------- pixel art mode (v12) ---------------- */
html.pixel .px-img{image-rendering:pixelated;image-rendering:crisp-edges}
html.pixel .px-on{visibility:hidden}
html.pixel .px-on > .px-img, html.pixel .px-on .px-mon{visibility:visible}
html.pixel #sceneSvg .px-on :is(.drift,.fall,.sparkle,.twin,.tstar,.lava-glow,.w-flame,.w-glow,.shim,.clouds,.aurora,.embers){visibility:visible;shape-rendering:crispEdges}
html.pixel .title-bg .px-on :is(.drift,.twin,.tstar,.shim,.clouds,.embers){visibility:visible;shape-rendering:crispEdges}
html.pixel .px-hero{animation:none !important}
html.pixel .px-mon{animation:mbob 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
html.pixel .enemy.walk .px-mon{animation:walkBob .25s ease-in-out infinite alternate}

/* ELON skill buttons + focus mode */
.elon-sk{display:flex;gap:6px}
.elon-sk button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-height:44px;border-radius:12px 14px 11px 13px;border:2.5px solid var(--ol);background:#2a1414;color:#fff;font:700 18px var(--hand);box-shadow:inset 0 -4px 0 #140a0a,0 3px 0 var(--ol);line-height:1.05}
.elon-sk button small{font-size:10.5px;font-weight:600;opacity:.9}
.elon-sk button i{font-style:normal;font-size:10.5px;color:#ffcf8a}
.elon-sk button.ready{background:#7a1e14;animation:ready 1s ease-in-out infinite}
.elon-sk button.on{background:#8a0f0f;outline:2px solid #ff3a3a}

/* installed app (Add to Home Screen): iOS reports 100dvh without the status bar → fill the whole screen instead */
@media (display-mode:standalone),(display-mode:fullscreen){ #app{height:auto;bottom:0} }
/* small portrait phones (iPhone SE / mini, small Android) */
@media (max-width:400px) and (orientation:portrait){
  .dock{padding:5px 6px 8px;gap:6px}
  .tiles{--tile:min(17vw,8.2vh,78px);gap:4px;padding:5px}
  .dock .tools .bigbtn{min-height:54px;min-width:54px}
  .atk{min-height:54px}
  .hud .face{width:40px;height:40px}.hud .score{font-size:21px}.hud .pill{font-size:13px;padding:2px 7px}.hud .pause{width:34px;height:34px}
  .fs-card b{font-size:11px}
  .minirow{flex:0 0 42px}
  .dock .attack{min-width:0}
}
@media (max-width:400px) and (max-height:700px) and (orientation:portrait){
  .stage{min-height:190px}
  .dock .right .trait{display:none}
}
/* phones held sideways: scene on the left, word board on the right */
@media (orientation:landscape) and (max-height:540px){
  .battle{flex-direction:row;overflow:hidden}
  .stage{flex:1 1 auto;min-height:0;min-width:0;border-bottom:0;border-right:3px solid #0a0806}
  .dock{flex:0 0 auto;width:min(50vw,calc(5 * var(--tile) + 78px));--tile:min(15.5vh,9.5vw,72px);overflow-y:auto;overflow-x:hidden;align-content:start;
    grid-template-columns:1fr auto;grid-template-areas:"right right" "tiles tiles" "tools attack";padding:7px 7px calc(7px + var(--safe-b));gap:7px}
  .dock .left{display:none}
  .tiles{--tile:inherit;gap:5px;padding:6px;justify-self:center}
  .dock .right{padding:5px 9px;gap:5px 9px}
  .dock .right .en-name{font-size:16px}
  .dock .right .trait{display:block;font-size:11.5px;padding:3px 7px;flex:1 1 100%}
  .estats{font-size:13.5px;padding:2px 7px}
  .dock .tools .bigbtn{min-height:50px;min-width:50px;font-size:13px}
  .dock .attack{min-width:0}
  .atk{min-height:52px !important;padding:0 10px}.atk .ico{font-size:28px}
  .minirow{flex:0 0 44px}
  .xsplit .atk,.xcharge{min-height:52px !important}
  .elon-sk{flex:0 0 54px}
  .hud{top:5px;left:8px;right:8px;gap:5px}
  .hud .face{width:42px;height:42px}.hud .bar{height:21px}.hud .bar span{font-size:12px}
  .hud .score{font-size:20px;padding-top:0}.combo-hud{transform:scale(.88);transform-origin:50% 0}
  .hud .pill{font-size:13px;padding:1px 7px}.hud .pause{width:34px;height:34px}
  .tray .t{width:30px;height:34px;font-size:21px;line-height:30px}
  /* menus */
  .topbar{padding:4px 12px}
  .tabbar{padding:2px 6px calc(2px + var(--safe-b))}
  .tabbar button{flex-direction:row;justify-content:center;gap:6px;padding:3px 0}
  .tabbar button .ico{font-size:22px}
  .title-content{padding:8px 18px 12px;zoom:.62}
  .modal-box,.sheet{max-height:92vh;overflow-y:auto}
}

VocabularyManager.pool().forEach(r=>{ GLOSS[r.word] = VocabularyManager.translationText(r); });

  for(let x=-200;x<4800;x+=R(260,520)) fore += HANG[pick(t.hang)](Math.round(x), Math.round(R(-60,-10)), t);

  <g id="lyFar">${far}</g>

  <rect id="vig" x="0" y="0" width="800" height="400" fill="url(#vig-${id})" pointer-events="none"/>
  <g id="fx"></g>
  </svg>`;
}

/* ==================== รูปตัวละครจากไฟล์ภาพ (แทนภาพวาดด้วยโค้ด) ====================
   ใส่ไฟล์ภาพ (PNG พื้นหลังโปร่งใส) ไว้ในโฟลเดอร์ public/heroes/ แล้วเพิ่มบรรทัดด้านล่าง
   ตัวไหนไม่ได้ใส่ไว้ เกมจะใช้ภาพวาดด้วยโค้ดแบบเดิม
     src   : ที่อยู่ไฟล์ภาพ
     h     : ความสูงตัวละครในเกม (ค่าเดิมประมาณ 150–175)
     flip  : true ถ้าภาพของคุณหันหน้าไปทางซ้าย (ในเกมตัวละครต้องหันขวา)
     dx,dy : เลื่อนภาพซ้าย/ขวา ขึ้น/ลง ถ้าเท้าไม่ตรงพื้น
     face  : (ไม่บังคับ) ตำแหน่งครอปหน้าสำหรับไอคอน HP ในรูป 'x y กว้าง สูง'
   ตัวอย่าง:
     pip: { src:'heroes/pip.png', h:160 },
     boomtos: { src:'heroes/boomtos.png', h:185, flip:true },
*/
const HERO_IMG = {
};
const HERO_IMG_VER = 22; // เปลี่ยนภาพแล้วภาพเก่ายังค้าง → เพิ่มเลขนี้ทีละ 1
function heroImgSVG(cfg){
  const h = cfg.h || 160, w = h, x = -w/2 + (cfg.dx||0), y = -h + (cfg.dy||0);
  const src = cfg.src + (cfg.src.includes('?') ? '&' : '?') + 'v=' + HERO_IMG_VER;
  return `<g class="hero-body hero-img">
    <ellipse class="shadow" cx="3" cy="1" rx="30" ry="6.5" fill="rgba(0,0,0,.35)"/>
    <g class="h-bob"><g${cfg.flip?' transform="scale(-1,1)"':''}><image href="${src}" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="xMidYMax meet"/></g></g>
  </g>`;
}

function monsterIcon(key){
  const m = MON[key]; const e = { art:m.art, pal:m.pal, boss:m.boss };
  const h = m.h*m.sc, s = Math.min(1, 150/Math.max(90,h));
  return `<svg viewBox="-80 -${Math.round(h*s+18)} 160 ${Math.round(h*s+24)}" aria-hidden="true"><g transform="scale(${(m.sc*s).toFixed(3)})">${monsterSVG(e)}</g></svg>`;
}

  function root(){
    if(defs && defs.isConnected) return defs;
    const s = document.createElementNS(NS,'svg');
    s.setAttribute('aria-hidden','true'); s.setAttribute('width','0'); s.setAttribute('height','0');
    s.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;pointer-events:none';
    defs = document.createElementNS(NS,'defs'); s.appendChild(defs);
    (document.body||document.documentElement).appendChild(s);
    have.clear();
    return defs;
  }
  function def(id, markup){ root(); if(!have.has(id)){ have.add(id); defs.insertAdjacentHTML('beforeend', markup); } return `url(#${id})`; }
  const stops = arr=>arr.map(([o,c,a])=>`<stop offset="${o}" stop-color="${c}"${a!=null?` stop-opacity="${a}"`:''}/>`).join('');
  const P = {
    mix, rgb, hex,
    lt:(c,t)=>mix(c,'#fff8e8',t==null?.3:t),            // warm light
    sh:(c,t)=>mix(c,'#24183a',t==null?.35:t),           // cool, slightly violet shadow
    ln:(c,t)=>mix(c,'#150b10',t==null?.74:t),           // tinted line colour
    /* body volume: light top-right → base → shadow bottom-left */
    vol(c, s){ const k='pv'+(s||'')+key(c); return def(k, `<linearGradient id="${k}" x1=".9" y1="0" x2=".1" y2="1">${stops([[0,P.lt(c,s==='s'?.18:.34)],[.42,c],[1,P.sh(c,s==='s'?.22:.36)]])}</linearGradient>`); },
    /* vertical volume (cloth, legs) */
    volV(c){ const k='pw'+key(c); return def(k, `<linearGradient id="${k}" x1="0" y1="0" x2="0" y2="1">${stops([[0,P.lt(c,.26)],[.5,c],[1,P.sh(c,.3)]])}</linearGradient>`); },
    /* horizontal cylinder (arms, legs, handles) */
    cyl(c){ const k='pc'+key(c); return def(k, `<linearGradient id="${k}" x1="0" y1="0" x2="1" y2="0">${stops([[0,P.sh(c,.38)],[.45,c],[.78,P.lt(c,.32)],[1,P.sh(c,.08)]])}</linearGradient>`); },
    /* polished metal banding */
    metal(c){ const k='pm'+key(c); return def(k, `<linearGradient id="${k}" x1=".05" y1="0" x2=".95" y2="1">${stops([[0,P.lt(c,.75)],[.18,P.lt(c,.25)],[.42,P.sh(c,.32)],[.52,P.sh(c,.12)],[.7,P.lt(c,.55)],[.86,c],[1,P.sh(c,.3)]])}</linearGradient>`); },
    /* vertical metal (blades, poles) */
    metalV(c){ const k='pn'+key(c); return def(k, `<linearGradient id="${k}" x1="0" y1="0" x2="1" y2="0">${stops([[0,P.sh(c,.28)],[.35,P.lt(c,.2)],[.5,P.lt(c,.8)],[.62,c],[1,P.sh(c,.4)]])}</linearGradient>`); },
    /* sphere / rounded volume */
    ball(c){ const k='pb'+key(c); return def(k, `<radialGradient id="${k}" cx=".62" cy=".3" r=".78">${stops([[0,P.lt(c,.55)],[.35,P.lt(c,.12)],[.75,c],[1,P.sh(c,.4)]])}</radialGradient>`); },
    /* glow halo (use on ellipses) */
    glow(c){ const k='pg'+key(c); return def(k, `<radialGradient id="${k}">${stops([[0,c,.85],[.4,c,.35],[1,c,0]])}</radialGradient>`); },
    /* soft ground shadow */
    shadow(){ return def('pshadow', `<radialGradient id="pshadow">${stops([[0,'#000',.55],[.6,'#000',.28],[1,'#000',0]])}</radialGradient>`); },
    /* gem facet */
    gem(c){ const k='pj'+key(c); return def(k, `<linearGradient id="${k}" x1=".2" y1="0" x2=".8" y2="1">${stops([[0,'#ffffff'],[.25,P.lt(c,.4)],[.6,c],[1,P.sh(c,.5)]])}</linearGradient>`); },
    iris(c){ const k='pi'+key(c); return def(k, `<radialGradient id="${k}" cx=".45" cy=".82" r=".9">${stops([[0,P.lt(c,.62)],[.45,c],[1,P.sh(c,.62)]])}</radialGradient>`); },
    white(){ return def('pwhite', `<linearGradient id="pwhite" x1="0" y1="0" x2="0" y2="1">${stops([[0,'#e8dce4'],[.35,'#fffdf8'],[1,'#fffaf0']])}</linearGradient>`); },
    /* raw registration for custom gradients */
    def,
  };
  /* outline attrs tinted by the fill colour */
  P.o = (c,w)=>`stroke="${P.ln(c)}" stroke-width="${w||2.4}" stroke-linejoin="round" stroke-linecap="round"`;
  /* thin inner detail line */
  P.d = (c,w,op)=>`stroke="${P.sh(c,.55)}" stroke-width="${w||1.4}" fill="none" stroke-linecap="round" stroke-linejoin="round"${op?` opacity="${op}"`:''}`;
  /* highlight stroke */
  P.h = (c,w,op)=>`stroke="${P.lt(c,.75)}" stroke-width="${w||2}" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="${op||.85}"`;
  return P;
})();

/* ======================================================================
   v9 MOONLIT ART DIRECTION — palette retune.
   Every painted gradient now shades toward a deep night-indigo instead of
   warm brown, highlights go cool-white and outlines turn navy, so all older
   art (monsters, gear, icons) sits under the same moonlight.
   ====================================================================== */
(()=>{
  const P = PAINT;
  P.lt = (c,t)=>P.mix(c,'#f4fbff',t==null?.3:t);
  P.sh = (c,t)=>P.mix(c,'#1b2458',Math.min(1,(t==null?.35:t)*1.08));
  P.ln = (c,t)=>P.mix(c,'#0e1233',t==null?.74:t);
})();

/* ----------------------------------------------------------------------
   C9 — cel-shaded moonlit gradients used by the v9 heroes/scenes.
   Light model: cool moon rim from the back-left, warm key from the front-right,
   indigo core shadow. Hard-ish stops give the painted cel look.
   ---------------------------------------------------------------------- */
const C9 = (()=>{
  const P = PAINT;
  const RIM = '#b4f6ff', WARM = '#fff0da', NIGHT = '#1c2458', BLUSH = '#c9707e';
  const k = c=>String(c).replace('#','').toLowerCase();
  const st = arr=>arr.map(([o,c,a])=>`<stop offset="${o}" stop-color="${c}"${a!=null?` stop-opacity="${a}"`:''}/>`).join('');
  const lin = (id,x1,y1,x2,y2,arr)=>P.def(id, `<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${st(arr)}</linearGradient>`);
  const m = P.mix;
  const G = {
    RIM, WARM, NIGHT, mix:m,
    ln:(c,t)=>m(c,'#0e1233',t==null?.7:t),
    sh:(c,t)=>m(c,NIGHT,t==null?.34:t),
    lt:(c,t)=>m(c,WARM,t==null?.25:t),
    rim:(c,t)=>m(c,RIM,t==null?.6:t),
    /* horizontal cel: rim | core shadow | base | warm light */
    cel(c){ return lin('c9c'+k(c),0,.08,1,0,[[0,m(c,RIM,.62)],[.07,m(c,RIM,.3)],[.1,m(c,NIGHT,.4)],[.34,m(c,NIGHT,.3)],[.4,c],[.82,m(c,WARM,.1)],[1,m(c,WARM,.3)]]); },
    /* same but light from the top (hats, pauldrons, wide shapes) */
    celV(c){ return lin('c9v'+k(c),.2,0,0,1,[[0,m(c,RIM,.45)],[.06,m(c,WARM,.22)],[.46,c],[.56,m(c,NIGHT,.26)],[1,m(c,NIGHT,.44)]]); },
    /* soft version for skin */
    skin(c){ return lin('c9s'+k(c),0,.1,1,0,[[0,m(c,RIM,.5)],[.08,m(c,BLUSH,.34)],[.28,m(c,BLUSH,.16)],[.46,c],[1,m(c,WARM,.35)]]); },
    /* polished metal bands */
    metal(c){ return lin('c9m'+k(c),0,0,1,.35,[[0,m(c,RIM,.8)],[.1,m(c,NIGHT,.5)],[.3,m(c,NIGHT,.18)],[.46,m(c,'#ffffff',.75)],[.54,c],[.8,m(c,NIGHT,.28)],[1,m(c,WARM,.45)]]); },
    /* hair: diagonal with shine */
    hair(c){ return lin('c9h'+k(c),0,0,1,.55,[[0,m(c,RIM,.55)],[.09,m(c,NIGHT,.32)],[.42,c],[.7,m(c,WARM,.14)],[1,m(c,WARM,.32)]]); },
    iris(c){ return lin('c9i'+k(c),0,0,0,1,[[0,m(c,'#070a20',.62)],[.45,c],[.85,m(c,'#ffffff',.42)],[1,m(c,'#ffffff',.6)]]); },
    glow(c){ return P.glow(c); },
    shadow(){ return P.shadow(); },
    gem(c){ return P.gem(c); },
  };
  G.o = (c,w)=>`stroke="${G.ln(c)}" stroke-width="${w||1.7}" stroke-linejoin="round" stroke-linecap="round"`;
  G.d = (c,w,op)=>`stroke="${m(c,NIGHT,.55)}" stroke-width="${w||1.1}" fill="none" stroke-linecap="round" stroke-linejoin="round"${op?` opacity="${op}"`:''}`;
  G.h = (c,w,op)=>`stroke="${m(c,'#ffffff',.7)}" stroke-width="${w||1.4}" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="${op||.8}"`;
  G.r = (w,op)=>`stroke="${RIM}" stroke-width="${w||1.6}" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="${op||.9}"`;
  /* moon rim-light filter for whole silhouettes (heroes + monsters) */
  G.rimFilter = ()=>P.def('moonrim', `<filter id="moonrim" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
    <feOffset in="SourceAlpha" dx="2.4" dy="2.8" result="o"/>
    <feComposite in="SourceAlpha" in2="o" operator="out" result="e"/>
    <feGaussianBlur in="e" stdDeviation=".7" result="eb"/>
    <feFlood flood-color="${RIM}" flood-opacity=".95"/>
    <feComposite in2="eb" operator="in" result="rim"/>
    <feComposite in="rim" in2="SourceAlpha" operator="in" result="rim2"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="rim2"/></feMerge></filter>`);
  return G;
})();

  /* skin head (hair / hood characters) */
  const HEAD = 'M-28,-4 C-28,-26 -10,-36 8,-36 C28,-36 41,-22 41,-3 C41,14 34,26 22,32 C14,36 5,37 -2,34 C-17,29 -28,16 -28,-4 Z';

      <path d="M26,-30 Q37,-22 39,-8" stroke="#fff3e6" stroke-width="3" fill="none" stroke-linecap="round" opacity=".55"/>

  /* face patch seen through a helmet opening */
  const TORSO = 'M-22,-82 C-27,-78 -28,-66 -26.5,-56 C-25.5,-50 -26.5,-44 -28,-36 L-28,-24 L-10,-27 L0,-22 L11,-27 L28,-24 L28,-36 C26.5,-44 25.5,-50 26.5,-56 C28,-66 27,-78 22,-82 C8,-87.5 -8,-87.5 -22,-82 Z';

  function arm(st, front, pad){

    return (p,big)=>{ const key = k+'|'+JSON.stringify(p)+'|'+(big?1:0); let v = cache.get(key);
      if(!v){ v = redrawn ? fn(p,big) : enrich(fn(p,big)); cache.set(key, v); } return v; };
  }
  return { A, enrich, wrap, eye, brow, limb };

/* ======================================================================
   SCENES v9 — moonlit painted vistas. A huge moon hangs behind the duel,
   stars and cloud streaks fill the sky, and five parallax layers
   (back ranges → mid-ground landmarks → framing props → ground → foreground
   silhouettes) scroll as the hero walks. Same layer ids as before, so
   scrollBg(), fitScene() and the battle code work unchanged.
   ====================================================================== */
const SCENE9 = (()=>{
  const G = C9, m = G.mix;
  const f = v=>(+v).toFixed(1);
  const T = {
    crypt:{ sky:['#060d26','#10295a','#1f5f86','#3f8fa6'], moon:'#effcff', mglow:'#8fe8f8', far1:'#24457a', far2:'#172c58', mid:'#1c3160', stone:'#7486b2', ground:'#15213f', gTop:'#35557e',
      flora:'#8ff0ff', accent:'#f5c96a', light:'#ffd27a', leaf:'#0b1430', mist:'#9fe6ff',
      far:['arch','colonnade','statue','obelisk','hoard','tower'], near:['column','column'], props:['coins','urn','rubble','moonflower','moonflower'] },
    woods:{ sky:['#03141c','#0a3040','#17606a','#4a9a90'], moon:'#f0fff6', mglow:'#9ff8d8', far1:'#15465a', far2:'#0e3044', mid:'#123a40', stone:'#5f8a86', ground:'#0c2224', gTop:'#2b6a4e',
      flora:'#a8ffd8', accent:'#b6ff8a', light:'#d8ff9a', leaf:'#041816', mist:'#a8ffe0',
      far:['bigtree','shrine','shrooms','waterfall','bigtree','ruin'], near:['trunk','trunk'], props:['fern','glowshroom','rock','moonflower','fern'] },
    ice:{ sky:['#040f2a','#0f2e62','#2a64a0','#6aa8d4'], moon:'#f4feff', mglow:'#bff6ff', far1:'#3a6aa4', far2:'#284f86', mid:'#3a5f96', stone:'#a8d0ee', ground:'#2a4476', gTop:'#dff4ff',
      flora:'#d8fbff', accent:'#7ff4ff', light:'#c8f8ff', leaf:'#081436', mist:'#e0f8ff', aurora:true,
      far:['spire','icearch','frozenfall','icetree','spire','frozenstatue'], near:['icepillar','icepillar'], props:['crystals','snowmound','crystals','rock'] },
    lava:{ sky:['#0c040c','#2a0a18','#6a1a1c','#b8452a'], moon:'#ffe0c4', mglow:'#ff9a5a', far1:'#3a1624', far2:'#26101c', mid:'#2e141c', stone:'#6a4450', ground:'#16080c', gTop:'#4a1e1c',
      flora:'#ff8a3a', accent:'#ff7a2e', light:'#ffb347', leaf:'#0c0408', mist:'#ff9a6a', ember:true,
      far:['keep','lavafall','brazier','obsidian','keep','cage'], near:['basalt','basalt'], props:['lavapool','rock','bones','obsidianS'] },
    necro:{ sky:['#03070a','#0a1a1e','#163232','#2a4a44'], moon:'#0e1614', mglow:'#8affb0', far1:'#18302e', far2:'#10221f', mid:'#162a28', stone:'#6a807a', ground:'#0a1413', gTop:'#26382f',
      flora:'#8affb0', accent:'#7fff5a', light:'#a8ff8a', leaf:'#030a09', mist:'#9affc8', eclipse:true,
      far:['mausoleum','graves','deadtree','angel','cauldron','graves'], near:['gravestone','fence'], props:['candles','bones','grave','deadbush'] },
  };
  /* ------------------------------ helpers ------------------------------ */
  const ridge = (rng,x0,x1,base,amp,step,jag)=>{ let d = `M${x0},420 L${x0},${f(base)}`; let y = base;
    for(let x=x0;x<=x1;x+=step*(0.6+rng()*0.8)){ y = base - amp*(jag? rng() : (Math.sin(x*.004+rng()*2)*.5+.5)); d += ` L${f(x)},${f(y)}`; }
    return d + ` L${x1},420 Z`; };
  const topLine = d=>d.replace(/^M[^L]+L[^L]+/,'M'+d.split(' L')[1]).replace(/ L[-\d.]+,420 Z$/,'');
  const lg = (id,arr,x2,y2)=>`<linearGradient id="${id}" x1="0" y1="0" x2="${x2||0}" y2="${y2==null?1:y2}">${arr.map(([o,c,a])=>`<stop offset="${o}" stop-color="${c}"${a!=null?` stop-opacity="${a}"`:''}/>`).join('')}</linearGradient>`;
  const spark = (x,y,s,c,cls,delay)=>`<path class="${cls||'sparkle'}" style="animation-delay:${f(delay||0)}s" d="M${f(x)},${f(y-s)} Q${f(x+s*.16)},${f(y-s*.16)} ${f(x+s)},${f(y)} Q${f(x+s*.16)},${f(y+s*.16)} ${f(x)},${f(y+s)} Q${f(x-s*.16)},${f(y+s*.16)} ${f(x-s)},${f(y)} Q${f(x-s*.16)},${f(y-s*.16)} ${f(x)},${f(y-s)} Z" fill="${c}"/>`;
  const glow = (x,y,rx,ry,c,op,cls)=>`<ellipse ${cls?`class="${cls}"`:''} cx="${f(x)}" cy="${f(y)}" rx="${f(rx)}" ry="${f(ry)}" fill="${G.glow(c)}" opacity="${op==null?.6:op}"/>`;
  // stone block with cel shading and a moon rim on its left edge
  const block = (x,y,w,h,c,r)=>`<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="${r||2}" fill="${G.cel(c)}" stroke="${G.ln(c,.6)}" stroke-width="1.2"/><path d="M${f(x+1.2)},${f(y+2)} L${f(x+1.2)},${f(y+h-2)}" ${G.r(1.4,.75)}/>`;

  /* ------------------------------ sky ------------------------------ */
  function sky(t,id,rng){
    let s = `<rect x="-1200" y="-400" width="4000" height="1000" fill="url(#sk9-${id})"/>`;
    for(let i=0;i<120;i++){ const x = -700+rng()*2200, y = -120+rng()*330, r = rng()*1.3+.3;
      s += `<circle class="${rng()<.35?'tstar':''}" cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="${rng()<.2?t.mglow:'#fff'}" opacity="${f(.35+rng()*.65)}" style="animation-delay:${f(rng()*3)}s"/>`; }
    for(let i=0;i<9;i++) s += spark(-500+rng()*1800, -80+rng()*230, 2.5+rng()*3.5, '#fff', 'tstar', rng()*3);
    if(t.aurora){
      s += `<g class="aurora" opacity=".55"><path d="M-600,40 C-200,-40 100,120 420,30 S1000,-20 1600,60 L1600,140 C1000,60 700,170 420,110 S-200,60 -600,140 Z" fill="url(#au9-${id})"/>
        <path d="M-600,-20 C-100,-80 200,60 560,-10 S1200,-40 1600,10 L1600,50 C1100,10 800,90 520,40 S-100,0 -600,40 Z" fill="url(#au9-${id})" opacity=".6"/></g>`;
    }
    // the moon — behind the duel, like a stage light
    const mx = 330, my = 136, mr = t.eclipse ? 56 : 64;
    s += glow(mx,my,230,200,t.mglow,.32) + glow(mx,my,120,110,t.mglow,.5);
    if(t.eclipse){
      s += `<circle cx="${mx}" cy="${my}" r="${mr+7}" fill="none" stroke="${t.mglow}" stroke-width="6" opacity=".35" class="w-glow"/>
        <circle cx="${mx}" cy="${my}" r="${mr+2}" fill="none" stroke="#dfffe8" stroke-width="2.4" opacity=".9"/>
        <circle cx="${mx}" cy="${my}" r="${mr}" fill="url(#mn9-${id})"/>
        <path d="M${mx-mr*.7},${my-mr*.5} A${mr},${mr} 0 0,1 ${mx+mr*.2},${my-mr*.96}" stroke="${t.mglow}" stroke-width="2" fill="none" opacity=".5"/>`;
    } else {
      s += `<circle cx="${mx}" cy="${my}" r="${mr}" fill="url(#mn9-${id})"/>
        ${[[-18,-14,11],[16,8,14],[-6,24,8],[24,-24,6],[-30,12,6],[6,-32,5]].map(([dx,dy,r])=>`<circle cx="${mx+dx}" cy="${my+dy}" r="${r}" fill="${m(t.moon,t.mglow,.5)}" opacity=".45"/><path d="M${mx+dx-r*.7},${my+dy-r*.3} A${r},${r} 0 0,1 ${mx+dx+r*.4},${my+dy-r*.9}" stroke="#fff" stroke-width="1.2" fill="none" opacity=".6"/>`).join('')}
        <path d="M${mx-mr+6},${my-18} A${mr-4},${mr-4} 0 0,1 ${mx-10},${my-mr+4}" stroke="#fff" stroke-width="3" fill="none" opacity=".7" stroke-linecap="round"/>`;
    }
    // cloud streaks drifting across
    const streak = (y,x0,w,op)=>`<path d="M${f(x0)},${f(y)} Q${f(x0+w*.3)},${f(y-7)} ${f(x0+w*.6)},${f(y-3)} Q${f(x0+w*.85)},${f(y-8)} ${f(x0+w)},${f(y)} Q${f(x0+w*.5)},${f(y+5)} ${f(x0)},${f(y)} Z" fill="${m(t.sky[2],t.mglow,.35)}" opacity="${op}"/>`;
    s += `<g class="clouds">`;
    for(let i=0;i<7;i++) s += streak(40+rng()*150, -500+rng()*1600, 160+rng()*260, f(.12+rng()*.22));
    s += streak(162, 180, 330, .38) + streak(118, 250, 220, .25) + `</g>`;
    return s;
  }
  /* ------------------------------ back (0.2) ------------------------------ */
  function back(t,id,rng){
    let s = '';
    const r1 = ridge(rng,-500,2600,238,96,70,true), r2 = ridge(rng,-500,2600,276,58,55,false);
    s += `<path d="${r1}" fill="url(#bk1-${id})"/><path d="${topLine(r1)}" stroke="${t.mglow}" stroke-width="1.6" fill="none" opacity=".45"/>`;
    if(id==='crypt'||id==='woods'){ // floating islands
      for(let i=0;i<5;i++){ const x = -300+i*520+rng()*200, y = 120+rng()*90, w = 40+rng()*50;
        s += `<g class="drift" style="animation-delay:${f(-rng()*7)}s"><path d="M${f(x-w)},${f(y)} Q${f(x-w*.4)},${f(y+w*.9)} ${f(x)},${f(y+w*1.1)} Q${f(x+w*.4)},${f(y+w*.9)} ${f(x+w)},${f(y)} Z" fill="${t.far2}"/>
          <path d="M${f(x-w-4)},${f(y)} Q${f(x)},${f(y-8)} ${f(x+w+4)},${f(y)} L${f(x+w)},${f(y+5)} L${f(x-w)},${f(y+5)} Z" fill="${m(t.gTop,t.far1,.35)}"/>
          <path d="M${f(x-w-4)},${f(y)} Q${f(x)},${f(y-8)} ${f(x+w+4)},${f(y)}" stroke="${t.mglow}" stroke-width="1.4" fill="none" opacity=".7"/>
          ${id==='woods'?`<circle cx="${f(x-w*.3)}" cy="${f(y-14)}" r="12" fill="${m(t.far1,t.flora,.2)}"/><path d="M${f(x-w*.3)},${f(y-4)} L${f(x-w*.3)},${f(y)}" stroke="${t.far2}" stroke-width="3"/>`:`<rect x="${f(x+w*.1)}" y="${f(y-20)}" width="7" height="20" fill="${m(t.stone,t.far1,.5)}"/><rect x="${f(x+w*.35)}" y="${f(y-13)}" width="6" height="13" fill="${m(t.stone,t.far1,.55)}"/>`}
          <path d="M${f(x-4)},${f(y+w*1.05)} L${f(x-6)},${f(y+w*1.5)} M${f(x+8)},${f(y+w*.9)} L${f(x+10)},${f(y+w*1.25)}" stroke="${t.far2}" stroke-width="2" stroke-linecap="round"/></g>`; }
    }

    let near = '';

        for(let k=0;k<3;k++){ const lx = x+R(-w*.6,w*.6); fore += `<path d="M${f(lx)},0 Q${f(lx+R(-6,6))},${f(R(30,70))} ${f(lx+R(-4,4))},${f(R(60,110))}" stroke="${t.leaf}" stroke-width="2" fill="none" opacity=".85"/><ellipse cx="${f(lx)}" cy="${f(R(60,110))}" rx="4" ry="7" fill="${t.leaf}" opacity=".85"/>`; } }

  }
  return { T, build, FAR9, NEAR9, spark, glow };

let DICT = null;
function loadDict(){
  if(DICT) return DICT;
  const s = DICT_FC, set = new Set(); let prev='', i=0;
  while(i<s.length){
    const k = s.charCodeAt(i)-48; i++;
    let j=i; while(j<s.length){ const c=s.charCodeAt(j); if(c>=48&&c<=57) break; j++; }
    const w = prev.slice(0,k)+s.slice(i,j); set.add(w); prev=w; i=j;
  }
  DICT = set; return set;
}

function stems(w){
  const out=[w];
  if(w.endsWith('ies')) out.push(w.slice(0,-3)+'y');
  if(w.endsWith('ied')) out.push(w.slice(0,-3)+'y');
  if(w.endsWith('es')) out.push(w.slice(0,-2));
  if(w.endsWith('s')) out.push(w.slice(0,-1));
  if(w.endsWith('ed')){ out.push(w.slice(0,-2)); out.push(w.slice(0,-1)); if(w[w.length-3]===w[w.length-4]) out.push(w.slice(0,-3)); }
  if(w.endsWith('ing')){ out.push(w.slice(0,-3)); out.push(w.slice(0,-3)+'e'); if(w[w.length-4]===w[w.length-5]) out.push(w.slice(0,-4)); }
  if(w.endsWith('er')){ out.push(w.slice(0,-2)); out.push(w.slice(0,-1)); }
  if(w.endsWith('est')){ out.push(w.slice(0,-3)); out.push(w.slice(0,-2)); }
  if(w.endsWith('ly')) out.push(w.slice(0,-2));
  return out;
}

function stageIndex(ch, n){ return ch*STAGES_PER + (n-1); }
function buildStage(ch, n){
  const C = CHAPTERS[ch], s = stageIndex(ch,n), rng = mulberry(hashStr('stage'+s));
  const count = n===STAGES_PER ? 1 : n<=2 ? 2 : n<=5 ? 3 : 4;
  const list = []; let last = null;
  // shuffle-bag so a stage rarely repeats the same monster
  let bag = [];
  for(let i=0;i<count;i++){
    if(!bag.length) bag = C.pool.slice().sort(()=>rng()-.5);
    let k = bag.pop(); if(k===last && bag.length) { const k2 = bag.pop(); bag.push(k); k = k2; }
    list.push(makeEnemy(k, s, rng, false)); last = k;
  }
  list.push(makeEnemy(C.mini, s, rng, false, true));
  if(n===STAGES_PER) list.push(makeEnemy(C.boss, s, rng, true));
  return { ch, n, s, theme:C.id, enemies:list };
}
function makeEnemy(key, s, rng, boss, mini){
  const T = MON[key];
  const v = .9 + rng()*.2;
  const hp = Math.round((18 + s*2.1) * v * (boss?2.3:mini?1.7:1));
  const atk = Math.round((4 + s*.6) * (boss?1.15:mini?1.1:1));
  const gold = Math.round((4 + s*1) * (boss?5:mini?3:1));
  const golden = !boss && !mini && rng() < .055;
  const ghp = golden ? Math.round(hp*.85) : hp;
  return { key, name:golden?'Golden '+T.name:T.name, th:golden?'โกลเดน '+T.th:T.th, art:T.art, pal:T.pal, sc:T.sc, h:T.h, boss:!!boss, mini:!!mini, golden, traits:T.traits.slice(), caster:!!T.caster,
    weak: WEAK_LETTERS[Math.floor(rng()*WEAK_LETTERS.length)], hp:ghp, maxHp:ghp, atk:golden?Math.round(atk*1.15):atk, gold:golden?gold*4:gold, charge:0, burn:0, burnDmg:0, stun:false, phase:1, phase2:false };
}

const SAVE_KEY = 'questlines_wordbattle_v1';
/* ---------------- global progress reset (v46) ----------------
   Bump GLOBAL_RESET_VERSION to make EVERY existing save start over once (developer-set number — never a date).
   A save whose globalResetVersion differs (or is missing) is backed up, then replaced by a fresh save that keeps
   only the player's settings and name. New saves are born with the current number, so they are never reset. */
const GLOBAL_RESET_VERSION = 1;
const GLOBAL_RESET_KEEP = ['settings','name'];          // preferences, not progress
let globalResetInfo = null;                             // set when a reset happened on this load → notice on screen
function globalResetIfNeeded(d, raw){
  if(!d || typeof d!=='object' || Array.isArray(d)) return null;          // not a save object → normal recovery path
  if(d.globalResetVersion === GLOBAL_RESET_VERSION) return null;
  const from = Number.isInteger(d.globalResetVersion) ? d.globalResetVersion : 0;
  const backupKey = SAVE_KEY + '_backup_r' + from;
  try{ if(localStorage.getItem(backupKey)===null) localStorage.setItem(backupKey, raw); }catch(e){}   // backup of the old save (first one kept; not used by gameplay)
  const fresh = defaultSave();
  GLOBAL_RESET_KEEP.forEach(k=>{
    if(k==='settings' && d.settings && typeof d.settings==='object') fresh.settings = Object.assign(fresh.settings, d.settings);
    if(k==='name' && typeof d.name==='string') fresh.name = d.name.slice(0, 40);
  });
  fresh.globalResetVersion = GLOBAL_RESET_VERSION;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(fresh)); }catch(e){}
  globalResetInfo = { from, to:GLOBAL_RESET_VERSION, backupKey };
  return fresh;
}
function defaultSave(){
  return { v:2, globalResetVersion:GLOBAL_RESET_VERSION, name:'', gold:0, hpLv:0, weapons:['wood'], armors:['none'], accs:[], acc:[null,null,null,null], chars:['knight'], eq:{ weapon:'wood', armor:'none', char:'knight' },
    potions:{ heal:2, power:1 }, up:{}, cleared:0, stars:{}, best:{},
    stats:{ words:0, longest:'', bestDmg:0, bestWord:'', kills:0, bosses:0, damage:0, bestCombo:0, golden:0, ultimates:0, crit:0 },
    mastery:{}, achievements:{}, book:{}, tutorial:false, settings:{ sfx:70, music:false, tts:true, autoSpeak:true, awake:true, webTr:true, rim:true } };
}
function migrate(d){
  if(d.shields && !d.armors) d.armors = d.shields;
  if(d.eq && d.eq.shield && !d.eq.armor) d.eq.armor = d.eq.shield;
  if(d.eq) delete d.eq.shield; delete d.shields;
  if(!Array.isArray(d.acc)) d.acc=[null,null];
  while(d.acc.length<4) d.acc.push(null);
  if(!d.up || typeof d.up!=='object') d.up = {};
  if(!d.mastery || typeof d.mastery!=='object') d.mastery = {};
  if(!d.achievements || typeof d.achievements!=='object') d.achievements = {};
  d.stats = Object.assign({words:0,longest:'',bestDmg:0,bestWord:'',kills:0,bosses:0,damage:0,bestCombo:0,golden:0,ultimates:0,crit:0}, d.stats||{});
  return d;
}
function loadSave(){
  try{ const raw = localStorage.getItem(SAVE_KEY); if(raw){ const parsed = JSON.parse(raw); const reset = globalResetIfNeeded(parsed, raw); if(reset) return reset; const d = migrate(parsed); return Object.assign(defaultSave(), d, { settings:Object.assign(defaultSave().settings, d.settings||{}), stats:Object.assign(defaultSave().stats, d.stats||{}), potions:Object.assign({heal:0,power:0}, d.potions||{}), eq:Object.assign(defaultSave().eq, d.eq||{}) }); } }catch(e){}
  return defaultSave();
}
let save = loadSave();
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

let audioCtx=null, musicTimer=null;
function ctxA(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
function tone(freq,dur,type,vol,delay){ const v=(save.settings.sfx/100)*(vol||.12); if(v<=0) return; const c=ctxA(); if(!c) return; const t0=c.currentTime+(delay||0);
  const o=c.createOscillator(), g=c.createGain(); o.type=type||'square'; o.frequency.setValueAtTime(freq,t0); g.gain.setValueAtTime(v,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+dur+.02); }
function slide(f1,f2,dur,type,vol,delay){ const v=(save.settings.sfx/100)*(vol||.1); if(v<=0) return; const c=ctxA(); if(!c) return; const t0=c.currentTime+(delay||0);
  const o=c.createOscillator(), g=c.createGain(); o.type=type||'square'; o.frequency.setValueAtTime(f1,t0); o.frequency.exponentialRampToValueAtTime(f2,t0+dur); g.gain.setValueAtTime(v,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur); o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+dur+.02); }
function noise(dur,vol,delay){ const v=(save.settings.sfx/100)*(vol||.1); if(v<=0) return; const c=ctxA(); if(!c) return; const t0=c.currentTime+(delay||0);
  const b=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=c.createBufferSource(), g=c.createGain(), f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1400; s.buffer=b; g.gain.value=v; s.connect(f).connect(g).connect(c.destination); s.start(t0); }
const sfx = {
  tap:(n)=>tone(520+(n||0)*55,.06,'triangle',.09),
  untap:()=>tone(330,.05,'triangle',.07),

/* letter chain sounds: 1-3 plain, 4+ increasingly magical */
const MAGIC_NOTES = [659,784,880,1046,1175,1318,1568,1760,2093];
sfx.letter = (n)=>{
  if(n<=3){ tone(480+n*60,.07,'triangle',.09); return; }
  const L = n-3, f = MAGIC_NOTES[Math.min(L-1, MAGIC_NOTES.length-1)], v = Math.min(.16, .08+L*.015);
  tone(f,.22,'sine',v); tone(f*1.5,.26,'triangle',v*.5,.03); tone(f*2,.3,'sine',v*.35,.06);
  for(let k=0;k<=L;k++) tone(f*2*(1+k*.26), .09, 'sine', .035, .05+k*.04);
  slide(f*.5, f*1.5, .3+L*.03, 'sine', .04);
  if(L>=3){ tone(f/4,.4,'sine',.1); noise(.25,.05+L*.01); }

  const tabs = [['char','ตัวละคร'],['weapon','อาวุธ'],['armor','ชุดเกราะ'],['acc','ไอเทมเสริม'],['potion','ยา']];
  let h = `<div class="panel shop-hero">${heroStandalone(save.eq)}<div><h2 class="title" style="margin:0">ร้านค้า</h2><div class="sub">ของที่ใส่จะแสดงบนตัวละครทันที</div>
    <div class="acc-slots">${[0,1,2,3].map(i=>{ if(i>=accSlots()) return `<span class="acc-slot locked" title="ปลดล็อกได้ที่หน้าฮีโร่">${ICON.lock}</span>`; const a=save.acc[i]; return `<span class="acc-slot ${a?'':'empty'}" title="${a?esc(ACC(a).th):'ช่องไอเทมว่าง'}">${a?ACC_ART[a]:'+'}</span>`; }).join('')}</div></div></div>
    <div class="seg seg6">${tabs.map(([k,l])=>`<button class="${t===k?'on':''}" data-act="shopTab" data-v="${k}">${l}</button>`).join('')}</div><div class="items ${t==='char'?'wide':''}">`;
  const eqBtn = (on, act, id)=> on ? `<button class="cbtn small wood" disabled>ใส่อยู่</button>` : `<button class="cbtn small blue" data-act="${act}" data-v="${id}">ใส่</button>`;
  if(t==='char'){
    CHARACTERS.forEach(c=>{
      const own = save.chars.includes(c.id), eq = save.eq.char===c.id;
      h += `<div class="panel item char-item ${eq?'equipped':''}"><div class="pic big">${heroStandalone(Object.assign({}, save.eq, { char:c.id }))}</div><div class="meta"><h4>${esc(c.name)}<small>${esc(c.th)}</small></h4>
        <div class="stat">${esc(c.role)} · ${esc(c.skill)}</div><p>${esc(c.desc)}</p>${own ? eqBtn(eq,'equipC',c.id) : buyBtn('buyC',c.id,c.price)}</div></div>`;
    });
    h += `<div class="panel item" style="opacity:.6"><div class="pic">${ICON.lock}</div><div class="meta"><h4>Coming soon<small>ฮีโร่ใหม่กำลังมา</small></h4><p>ตัวละครใหม่จะเพิ่มเข้ามาเรื่อยๆ</p></div></div>`;
  }
  if(t==='weapon') WEAPONS.forEach(w=>{
    const own = save.weapons.includes(w.id), eq = save.eq.weapon===w.id;
    h += `<div class="panel item ${eq?'equipped':''}"><div class="pic">${weaponIcon(w.id)}</div><div class="meta"><h4>${esc(w.name)}<small>${esc(w.th)}</small></h4>
      <div class="stat">ATK ${w.atk}</div><p>${esc(w.perkTh||'อาวุธพื้นฐาน')}</p>${own ? eqBtn(eq,'equipW',w.id) : buyBtn('buyW',w.id,w.price)}</div></div>`;
  });
  if(t==='armor') ARMORS.forEach(s=>{
    const own = save.armors.includes(s.id), eq = save.eq.armor===s.id;
    h += `<div class="panel item ${eq?'equipped':''}"><div class="pic">${s.id==='none'?'<span class="sub">—</span>':shieldIcon(s.id)}</div><div class="meta"><h4>${esc(s.name)}<small>${esc(s.th)}</small></h4>
      <div class="stat">กันดาเมจ ${Math.round(s.block*100)}%${s.hp?` · HP +${s.hp}`:''}</div><p>${s.id==='none'?'ชุดพื้นฐาน ไม่มีเกราะ':'ลดดาเมจจากมอนสเตอร์ และเพิ่ม HP สูงสุด'}</p>${own ? eqBtn(eq,'equipA',s.id) : buyBtn('buyA',s.id,s.price)}</div></div>`;
  });
  if(t==='acc'){
    h += `<p class="sub" style="grid-column:1/-1;margin:0">${esc(CH(save.eq.char).name)} ใส่ไอเทมเสริมได้ ${accSlots()} ชิ้น · ซื้อช่องเพิ่มได้ที่หน้า ฮีโร่ → อัปเกรด</p>`;
    ACCESSORIES.forEach(x=>{
      const own = save.accs.includes(x.id), on = hasAcc(x.id);
      h += `<div class="panel item ${on?'equipped':''}"><div class="pic">${ACC_ART[x.id]}</div><div class="meta"><h4>${esc(x.name)}<small>${esc(x.th)}</small></h4><p>${esc(x.desc)}</p>
        ${!own ? buyBtn('buyX',x.id,x.price) : on ? `<button class="cbtn small wood" data-act="unequipX" data-v="${x.id}">ถอดออก</button>` : `<button class="cbtn small blue" data-act="equipX" data-v="${x.id}">ใส่</button>`}</div></div>`;
    });
  }
  if(t==='potion') Object.entries(POTIONS).forEach(([k,p])=>{
    h += `<div class="panel item"><div class="pic">${ICON[p.icon]}</div><div class="meta"><h4>${esc(p.name)}<small>${esc(p.th)} · มีอยู่ ${save.potions[k]||0}</small></h4><p>${esc(p.desc)}</p>${buyBtn('buyP',k,p.price)}</div></div>`;
  });
  if(false){
    const max = save.hpLv>=10;
    h += `<div class="panel item"><div class="pic">${ICON.heart}</div><div class="meta"><h4>Heart Up<small>เพิ่ม HP สูงสุด · เลเวล ${save.hpLv}/10</small></h4>
      <div class="stat">HP ${maxHp()}</div><p>HP พื้นฐานสูงขึ้นถาวร +25</p>
      ${max?`<button class="cbtn small wood" disabled>สูงสุดแล้ว</button>`:`<button class="cbtn small gold" data-act="buyHp" ${save.gold<hpPrice()?'disabled':''}>${ICON.coin} ${hpPrice()}</button>`}</div></div>`;
  }
  return h + `</div>`;
}

  return `<div class="panel sheet"><div class="hero-stage">${rockLedge()}${heroStandalone(save.eq)}</div>
    <div><h3>${esc(save.name||c.name)}</h3><span class="brush">${esc(c.name)} · ${esc(c.role)}</span>

      <div class="eq-list"><span>🛡 ${esc(AR(save.eq.armor).th)} (${Math.round(AR(save.eq.armor).block*100)}%)</span>${save.acc.slice(0,accSlots()).map(a=>a?`<span>${ACC_ART[a]} ${esc(ACC(a).th)}</span>`:'').join('')}</div></div></div>${atkPicker()}`;

function atkPicker(){
  const k = save.eq.char, c = sprOf(k); if(!c) return '';
  const cur = atkPoseOf(k), show = ui.atkDemo && c.anims[ui.atkDemo] ? ui.atkDemo : cur;
  const btn = (n,label,on)=>`<button class="${on?'on':''}" data-act="atkPose" data-v="${n}" aria-pressed="${on}">${label}</button>`;
  return `<div class="panel atk-pick"><h3 style="margin:0 0 8px">⚔️ ท่าโจมตี</h3>
    <div class="seg">${c.demoOnly ? [...c.attacks, ...(c.extra||[])].map(n=>btn('demo:'+n, esc(c.anims[n].th||n), n===show)).join('') : c.attacks.map(n=>btn(n, esc(c.anims[n].th||n), n===cur && show===cur)).join('')}${c.finisher?btn('demo:'+c.finisher, '🔥 '+esc(c.anims[c.finisher].th), show===c.finisher):''}</div>
    <svg class="atk-demo" viewBox="-130 -196 360 208" aria-hidden="true"><g class="spr-demo pose-${show}">${charSVG(save.eq)}</g></svg>
    <p class="sub" style="margin:4px 0 0">${c.demoOnly?'':'เลือกท่าที่ใช้ตอนโจมตีปกติ · '}${c.finNote || `สะกดคำ ${c.finMin} ตัวอักษรขึ้นไปจะใช้<b>ท่าไม้ตาย</b>อัตโนมัติ`}</p></div>`;
}
function renderUpgrades(){
  const id = ui.upChar && save.chars.includes(ui.upChar) ? ui.upChar : save.eq.char, c = CH(id), u = UP(id);
  let h = `<div class="chip-row" role="tablist">${save.chars.map(k=>`<button class="chip ${k===id?'on':''}" data-act="upChar" data-v="${k}" aria-pressed="${k===id}">${heroFaceSvg(Object.assign({}, save.eq, { char:k }))}${esc(CH(k).name)}</button>`).join('')}</div>`;
  h += `<div class="statline"><span>${ICON.sword} x${(1+u.atk*.08).toFixed(2)}</span><span>${ICON.shield} -${u.def*3}%</span><span>${ICON.heart} ${maxHpOf(id)}</span><span>🎒 ${2+u.slot}</span></div>`;
  Object.entries(UPS).forEach(([k,U])=>{
    const lv = u[k], max = lv>=U.max, cost = max?0:U.cost(lv);
    const ic = k==='slot' ? '🎒' : ICON[U.icon];
    h += `<div class="panel up-row"><div class="ic">${ic}</div>
      <h4>${U.en} Lv ${lv}<small>${U.th}</small></h4>
      ${max?`<button class="cbtn small wood" disabled>สูงสุด</button>`:`<button class="cbtn small gold" data-act="buyUp" data-v="${k}" data-c="${id}" ${save.gold<cost?'disabled':''}>${ICON.coin} ${cost}</button>`}
      <div class="fx"><div class="pips10 ${k==='slot'?'slot':''}">${Array.from({length:U.max},(_,i)=>`<i class="${i<lv?'on':''}"></i>`).join('')}</div>ตอนนี้ ${U.fx(lv)}${max?'':` → <b>${U.fx(lv+1)}</b>`}</div></div>`;
  });
  if(save.hpLv) h += `<p class="sub">โบนัส Heart Up เดิม +${save.hpLv*25} HP ยังใช้ได้กับทุกตัวละคร</p>`;
  return h + `<p class="sub">การอัปเกรดเป็นของตัวละครแต่ละตัว ปลดล็อกตัวละครใหม่ได้ที่ร้านค้า</p>`;
}

/* ============================== BATTLE ============================== */
const HERO_X = 235, EN_X = 560, Q_X = 745, FLOOR_Y = 330;
function gemSvg(k){
  if(k==='gold') return `<span class="gem">${ICON.coin}</span>`;
  if(k==='heart') return `<span class="gem">${ICON.heart}</span>`;
  return `<span class="gem"><svg viewBox="0 0 40 40"><path d="M20,4 L34,16 L20,36 L6,16 Z" fill="#5ae0ff" stroke="#2a1a10" stroke-width="3" stroke-linejoin="round"/><path d="M20,4 L20,36 M6,16 L34,16" stroke="#fff" stroke-width="2" opacity=".6"/></svg></span>`;
}
function newTile(lvl){
  const l = pickW(LETTER_POOL);
  let gem = null;
  if(Math.random() < .1 + Math.min(.08, lvl*.004)) gem = pickW([['gold',4],['heart',3],['gem',3]]);
  return { l, gem, stone:0, sel:false, id:Math.random().toString(36).slice(2,8), fresh:true };
}
function balanceTiles(tiles, freshOnly){
  const vow = ()=>tiles.filter(t=>!t.stone && VOWELS.has(t.l)).length;
  let guard=0;

function evalWord(){
  const b = ui.bat, e = curEnemy(), w = selWord(), n = b.sel.length;
  const len = VocabularyManager.wordLength(w);   // v45: one place computes word length
  if(n===0) return { w, state:'empty' };
  if(len<3) return { w, state:'short' };
  const rude = RUDE.has(w);
  if(!rude && !VocabularyManager.isPlayable(w)) return { w, state:'bad' };
  const wp = curWp();
  let p = 0, gems = 0, auras = 0;
  b.sel.forEach(i=>{ const t=b.tiles[i]; let v = t.l==='qu'?4:pts(t.l);
    if(wp.perk==='vowel' && VOWELS.has(t.l)) v += 1;
    if(wp.perk==='rare' && ['j','k','qu','v','x','z','w','y','f'].includes(t.l)) v *= 2;
    if(t.gem==='gem') gems++; if(t.aura && !t.stone) auras++; p += v; });
  /* v44 balance — BASE × (1 + ΣBONUS) × (1 + ΣBURST) × penalties (see js/ql2/balance.js) */
  const B = BALANCE, pc = x=>`+${B.pct(x)}%`;
  const lenMul = 1 + Math.max(0,len-4)*B.LEN_STEP;
  let bonus = 0, burst = 0, factor = 1;
  const notes = [];
  if(wp.perk==='long' && len>=6){ bonus += B.PERK.axeLong; notes.push(`ขวาน ${pc(B.PERK.axeLong)}`); }
  if(wp.perk==='burn') bonus += B.PERK.flame;
  if(gems){ bonus += gems*B.GEM_BONUS; notes.push(`อัญมณี ${pc(gems*B.GEM_BONUS)}`); }
  if(auras){ bonus += auras*B.AURA_BONUS; notes.push(`ออร่า ${pc(auras*B.AURA_BONUS)}`); }
  if(hasAcc('sage') && len>=5){ bonus += B.SAGE_BONUS; notes.push(`หินปราชญ์ ${pc(B.SAGE_BONUS)}`); }
  const m = rude ? null : meaning(w, 'combat'), bank = !rude && VocabularyManager.isTargetWord(w);
  if(bank){ const bm = hasAcc('lens') ? B.SCHOLAR_LENS_BONUS : B.TARGET_WORD_BONUS; bonus += bm; notes.push(`คำศัพท์เป้าหมาย ${pc(bm)}`); }
  if(rude){ burst += B.RUDE_BONUS; }
  const el = rude ? null : elementOf(w);
  if(el){ let em = Math.max(0, ELEMENTS[el].mult - 1); if(el==='holy' && e && UNDEAD.has(e.art)) em += B.HOLY_UNDEAD_BONUS; if(charIs('mira')) em += .5; bonus += em; notes.unshift(`${ELEM_ICON[el]} ${ELEMENTS[el].name}: ${ELEMENTS[el].desc}`); }
  if(charIs('bruna')) factor *= 1 + (1 - Math.max(0,ui.bat.hp)/ui.bat.max);
  if(charIs('luma')) factor *= .9;
  if(b.power){ burst += B.POWER_POTION_BONUS; notes.push(`ยาพลัง ${pc(B.POWER_POTION_BONUS)}`); }
  let weak = false;
  if(e){
    if(e.traits.includes('weak') && w.includes(e.weak)){ weak = true; burst += B.WEAKNESS_BONUS; notes.push(`WEAKNESS! จุดอ่อน ${e.weak.toUpperCase()} ${pc(B.WEAKNESS_BONUS)}`); }
    if(e.traits.includes('armor3') && len<=3){ factor *= .5; notes.push('เกราะ ครึ่งเดียว'); }
    if(e.traits.includes('armor4') && len<=4){ factor *= .5; notes.push('โปร่งแสง ครึ่งเดียว'); }
  }
  const md = masteryInfo(w);
  if(!rude && md.lv>1){ bonus += (md.lv-1)*B.MASTERY_PER_LV; notes.push(`Mastery Lv.${md.lv} ${pc((md.lv-1)*B.MASTERY_PER_LV)}`); }
  if(b.combo>0){ const cb = B.comboBonus(b.combo); bonus += cb; notes.push(`Combo ${pc(cb)}`); }
  const rareCount = [...w].filter(c=>['j','k','q','v','x','z'].includes(c)).length;
  const crit = !rude && (len>=8 || rareCount>=2);
  if(crit){ burst += B.CRIT_BONUS; notes.push(`CRITICAL WORD! ${pc(B.CRIT_BONUS)}`); }
  const base = p * lenMul * wp.atk/B.WEAPON_REF * atkMul();
  const dmg = Math.max(1, Math.round(base * (1+bonus) * (1+burst) * factor));
  const selfDmg = rude ? Math.round(ui.bat.max*.3) : 0;
  return { w, state:'ok', dmg, bank, meaning:m, notes, rude, selfDmg, el, crit, weak, mastery:md, base, bonus, burst, factor };
}

/* hint: search dictionary for the best playable word */
function findBest(){
  const b = ui.bat, cnt = new Array(27).fill(0);
  b.tiles.forEach(t=>{ if(t.stone) return; if(t.l==='qu') cnt[26]++; else cnt[t.l.charCodeAt(0)-97]++; });
  let best=null, bestScore=-1;
  const c = cnt.slice();
  for(const w of DICT){
    if(w.length>7) continue;
    for(let k=0;k<27;k++) c[k]=cnt[k];
    let ok=true, score=0;
    for(let j=0;j<w.length;j++){
      const code = w.charCodeAt(j)-97;
      if(code===16){ if(w[j+1]==='u' && c[26]>0){ c[26]--; j++; score+=4; continue; } ok=false; break; }
      if(--c[code]<0){ ok=false; break; }
      score += LETTERS[w[j]] ? LETTERS[w[j]][1] : 1;
    }

/* --------------------- mini-boss word puzzle --------------------- */
// After a mini-boss falls, a word from the vocabulary list appears with some letters
// missing. Fill them in for a reward; rewards grow with the chapter.
function pzPickWord(ch){
  const lv = ch<=1 ? 'A2' : ch<=3 ? 'B1' : 'B2';
  const pool = WORD_BANK[lv].filter(w=>/^[a-z]+$/.test(w.word) && w.word.length>=4);
  const fresh = pool.filter(w=>!(save.book[w.word] && save.book[w.word].pz));
  const L = fresh.length ? fresh : pool; return L[Math.floor(Math.random()*L.length)];
}
function pzGold(){ const b = ui.bat; return Math.round((25 + b.stage.s*5) * (1 + b.stage.ch*.6) * goldMul()); }
function wordPuzzle(e){
  return new Promise(resolve=>{
    const ch = ui.bat.stage.ch, info = pzPickWord(ch), w = info.word;
    const nBlank = Math.max(1, Math.min(w.length-2, [1,2,2,3,3][ch] + (w.length>=7 && ch>0 ? 1 : 0)));
    const idx = [...Array(w.length).keys()].slice(1).sort(()=>Math.random()-.5).slice(0,nBlank).sort((a,b)=>a-b);
    const keys = idx.map(i=>w[i]);
    const extra = 'aeioutnsrlhdcmpgbfwyk'.split('').sort(()=>Math.random()-.5);
    while(keys.length < Math.max(6, nBlank+4)) keys.push(extra.pop());
    ui.pz = { w, info, idx, fill:Array(nBlank).fill(null), keys:keys.sort(()=>Math.random()-.5).map(l=>({ l, used:false })), tries:3, miss:0, resolve, name:e.th };
    sfx.win(); renderPuzzle();
  });
}
function renderPuzzle(){
  const z = ui.pz; if(!z) return;
  let k = 0;
  const cur = z.fill.indexOf(null);
  const slots = z.w.split('').map((c,i)=>{ if(!z.idx.includes(i)) return `<span>${c}</span>`; const n = k++; const f = z.fill[n];
    return `<button class="${f!==null?'f':''} ${n===cur?'cur':''}" data-act="pzSlot" data-k="${n}" aria-label="ช่องที่ ${n+1}">${f!==null?z.keys[f].l:''}</button>`; }).join('');
  modal(`<div class="pz"><h3>ปริศนาคำศัพท์</h3><span class="brush gold th">รางวัลจาก ${esc(z.name)}</span>
    <p class="pz-clue">${esc(z.info.thai)}<small>${esc(z.info.def)}</small></p>
    <div class="pz-word" id="pzWord">${slots}</div>
    <div class="pz-tries" aria-label="เหลือ ${z.tries} ครั้ง">${[0,1,2].map(i=>i<z.tries?ICON.heart:`<span style="opacity:.25">${ICON.heart}</span>`).join('')}</div>
    <div class="pz-keys">${z.keys.map((x,i)=>`<button data-act="pzKey" data-k="${i}" ${x.used?'style="visibility:hidden"':''}>${x.l}</button>`).join('')}</div>
    <div class="btns"><button class="cbtn blue block" data-act="pzCheck" ${z.fill.includes(null)?'disabled':''}>ตรวจคำตอบ</button>
    <button class="cbtn wood small" data-act="say" data-v="${esc(z.w)}">🔊 ฟังเสียงเป็นคำใบ้</button></div>
    <p style="font-size:13.5px;margin:10px 0 0">รางวัล ${ICON.coin} ${pzGold()} · ตอบถูกครั้งแรกได้ x1.5${ui.bat.stage.ch>=1?' + ยา':''}</p></div>`);

function pzKey(i){ const z = ui.pz; if(!z || z.keys[i].used) return; const n = z.fill.indexOf(null); if(n<0) return; z.fill[n] = i; z.keys[i].used = true; sfx.tap(n); renderPuzzle(); }
function pzSlot(n){ const z = ui.pz; if(!z || z.fill[n]===null) return; z.keys[z.fill[n]].used = false; z.fill[n] = null; sfx.untap(); renderPuzzle(); }
function pzBack(){ const z = ui.pz; if(!z) return; for(let n=z.fill.length-1;n>=0;n--) if(z.fill[n]!==null){ pzSlot(n); return; } }
function pzCheck(){
  const z = ui.pz; if(!z || z.fill.includes(null)) return;
  const input = z.w.split('').map((c,i)=>{ const n = z.idx.indexOf(i); return n<0 ? c : z.keys[z.fill[n]].l; }).join('');
  const ok = VocabularyManager.validateAnswer(input, z.w);   // v45: answer matching lives in the vocabulary system

/* ======================================================================
   ENDLESS TOWER — climb forever. One monster per floor, a mini-boss every
   5 floors and a boss every 10. The scenery changes every 10 floors, the
   monsters keep getting stronger (no cap), HP carries between floors and
   every 10th floor pays a milestone reward. Best floor is saved.
   ====================================================================== */
if(!save.tower) save.tower = { best:0, runs:0 };
const TOWER = {
  chapterOf: f=>Math.floor((f-1)/10) % CHAPTERS.length,
  enemy(f, seed){
    const ci = TOWER.chapterOf(f), C = CHAPTERS[ci], rng = mulberry(hashStr('tower'+seed+'|'+f));
    const boss = f%10===0, mini = !boss && f%5===0;
    const key = boss ? C.boss : mini ? C.mini : C.pool[Math.floor(rng()*C.pool.length)];
    const s = Math.min(39, Math.round(f*.9));
    const e = makeEnemy(key, s, rng, boss, mini);
    // past floor 40 the tower keeps scaling with no ceiling
    const over = Math.max(0, f-40);
    const hm = 1 + over*.07 + Math.pow(over,1.35)*.004, am = 1 + over*.045;
    e.hp = e.maxHp = Math.round(e.maxHp*hm); e.atk = Math.round(e.atk*am); e.gold = Math.round(e.gold*(1+over*.03));
    // deep floors add an extra trait
    if(f>=30 && !e.boss){ const extra = ['regen','armor3','vamp','stone'][Math.floor(rng()*4)]; if(!e.traits.includes(extra)) e.traits.push(extra); }
    e.floor = f;
    return e;
  },
  topUp(b){ while(b.stage.enemies.length < b.idx+3){ const f = b.stage.enemies.length+1; b.stage.enemies.push(TOWER.enemy(f, b.stage.seed)); } },
  floor: b=>b.idx+1,
};
function startTower(){
  loadDict();
  const seed = Date.now()%100000;
  const st = { ch:0, n:1, s:0, theme:CHAPTERS[0].id, enemies:[], tower:true, seed };
  ui.bat = { stage:st, idx:0, hp:maxHp(), max:maxHp(), score:0, kills:0, goldGain:0, busy:true, sel:[], tiles:[], hints:3+(hasAcc('lens')?1:0)+(save.eq.char==='pip'?1:0), combo:0, ult:0, evade:0, stoneSkin:0, power:false,
    recent:[], last:null, dist:0, words:0, bestWord:'', bestDmg:0, over:false, paused:false, phoenix:hasAcc('phoenix') };
  const b = ui.bat; b.prevBest = save.tower.best||0; TOWER.topUp(b);
  for(let i=0;i<15;i++) b.tiles.push(newTile(st.s));
  balanceTiles(b.tiles); applyAura();
  save.tower.runs = (save.tower.runs||0)+1; persist();
  ui.screen = 'battle';
  buildBattleDom();
  intro();
}
/* tiles use the floor's difficulty for gem odds */
const _enemyDiesT = enemyDies;
enemyDies = async function(){
  const b = ui.bat;
  if(b && b.stage.tower){
    TOWER.topUp(b);
    const f = TOWER.floor(b);
    if(f > (save.tower.best||0)){ save.tower.best = f; }  // best = highest floor cleared
    b.stage.s = Math.min(39, Math.round((f+1)*.9));
    if(f%10===0){
      const g = Math.round((60 + f*6)*goldMul()); save.gold += g; b.goldGain += g;
      save.potions.heal = (save.potions.heal||0)+1;
      setTimeout(()=>{ if(ui.bat===b){ banner(`ชั้น ${f} พิชิต!`, `รางวัลหอคอย +${g} ทอง · ยาฟื้นพลัง +1`, 'mini'); sfx.win(); } }, 900);
    }
    persist();
  }
  return _enemyDiesT();
};
/* a new region of the tower every 10 floors: rebuild the scene and walk in */
const _walkToNextT = walkToNext;
walkToNext = async function(){
  const b = ui.bat;
  if(!b || !b.stage.tower) return _walkToNextT();
  const f = TOWER.floor(b);
  if(f>1 && f%10===1){

/* ======================================================================
   PIXEL ART MODE (v12) — ฉาก มอนสเตอร์ และหน้าแรก ถูกแปลงเป็นภาพพิกเซล
   ให้เข้ากับตัวละครสไปรต์ ภาพวาดเวกเตอร์เดิมถูกวาดลงแคนวาสความละเอียดต่ำ
   (1 พิกเซล = 2 หน่วยฉาก) แล้วขยายแบบไม่เบลอ ส่วนที่ขยับได้ (ละออง ดาว
   ประกายไฟ) ยังเป็นเวกเตอร์แต่ขอบเหลี่ยม · ปิดได้ในตั้งค่า (PIXEL.on)
   ====================================================================== */
const PIXEL = (()=>{
  const NS = 'http://www.w3.org/2000/svg';
  const SCENE_PX = 2.6;
  const LIVE = '.drift,.fall,.sparkle,.twin,.tstar,.lava-glow,.w-flame,.w-glow,.shim,.clouds,.aurora,.embers,.ped-rune,.ped-glow,.hd-live';
  const cache = new Map();
  let on = true;
  try{ on = localStorage.getItem('ql_pixel') !== '0'; }catch(e){}
  if(on) document.documentElement.classList.add('pixel');

  function allDefs(extra){
    let s = '';
    document.querySelectorAll('svg[width="0"] > defs').forEach(d=>{ s += d.innerHTML; });
    return s + (extra||'');
  }
  function toURL(markup, bb, px, defs){
    const w = Math.max(1, Math.round(bb.width/px)), h = Math.max(1, Math.round(bb.height/px));
    const svg = `<svg xmlns="${NS}" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="${bb.x} ${bb.y} ${bb.width} ${bb.height}" width="${w}" height="${h}" preserveAspectRatio="none"><defs>${defs}</defs>${markup}</svg>`;
    return new Promise((res)=>{
      const img = new Image();
      img.onload = ()=>{
        try{
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          const x = c.getContext('2d'); x.drawImage(img, 0, 0, w, h);
          // posterise a little so gradients band like hand-made pixel art
          const id = x.getImageData(0,0,w,h), d = id.data;
          for(let i=0;i<d.length;i+=4){ d[i]=d[i]&0xF8; d[i+1]=d[i+1]&0xF8; d[i+2]=d[i+2]&0xF8; d[i+3] = d[i+3]<24 ? 0 : d[i+3]>232 ? 255 : d[i+3]&0xE0; }
          x.putImageData(id,0,0);
          if(c.toBlob) c.toBlob(b=>res(b ? URL.createObjectURL(b) : c.toDataURL()), 'image/png');
          else res(c.toDataURL());
        }catch(e){ res(null); }
      };
      img.onerror = ()=>res(null);
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    });
  }
  const pad = (bb,p)=>({ x:Math.floor(bb.x-p), y:Math.floor(bb.y-p), width:Math.ceil(bb.width+p*2), height:Math.ceil(bb.height+p*2) });
  function imageEl(url, bb){
    const im = document.createElementNS(NS,'image');
    im.setAttribute('href', url); im.setAttribute('x', bb.x); im.setAttribute('y', bb.y);
    im.setAttribute('width', bb.width); im.setAttribute('height', bb.height);
    im.setAttribute('preserveAspectRatio','none'); im.setAttribute('class','px-img');
    return im;
  }
  // a static layer → one pixel image; animated bits stay live (vector, crisp edges)
  async function layer(g, px, defs){
    if(!g || g.classList.contains('pxd')) return;
    g.classList.add('pxd');
    let bb; try{ bb = g.getBBox(); }catch(e){ return; }
    if(!bb.width || !bb.height) return;
    bb = pad(bb, 2);
    const clone = g.cloneNode(true);
    clone.querySelectorAll(LIVE).forEach(n=>n.remove());
    clone.querySelectorAll('image.px-img').forEach(n=>n.remove());
    const url = await toURL(clone.innerHTML, bb, px, defs);
    if(!url || !g.isConnected) return;
    const im = imageEl(url, bb);
    g.insertBefore(im, g.firstChild);
    g.classList.add('px-on');
  }
  async function scene(svg){
    if(svg.classList.contains('pxd')) return;
    svg.classList.add('pxd');
    const own = svg.querySelector(':scope > defs');
    const defs = allDefs(own ? own.innerHTML : '');
    for(const id of ['lySky','lyBack','lyFar','lyNear','lyFloor','lyFore']) await layer(svg.querySelector('#'+id), SCENE_PX, defs);
  }
  async function title(svg){
    if(svg.classList.contains('pxd')) return;
    svg.classList.add('pxd');
    const own = svg.querySelector(':scope > defs');
    // wrap the vista so it behaves like one layer
    const g = document.createElementNS(NS,'g'); g.setAttribute('class','px-wrap');
    [...svg.childNodes].forEach(n=>{ if(n!==own) g.appendChild(n); });
    svg.appendChild(g);
    await layer(g, SCENE_PX, allDefs(own ? own.innerHTML : ''));
  }
  async function monster(g){
    if(g.classList.contains('pxd')) return;
    g.classList.add('pxd');
    const root = g.ownerSVGElement; if(!root) return;
    let bb; try{ bb = g.getBBox(); }catch(e){ return; }
    if(!bb.width || !bb.height) return;
    let px;
    const hero = g.classList.contains('pxh');
    if(root.id === 'sceneSvg' || hero){ const a = g.getCTM(), r = root.getCTM(); px = (hero ? 2 : SCENE_PX) * ((r && r.a) || 1) / ((a && a.a) || 1); }
    else px = Math.max(bb.width, bb.height) / 64;
    px = Math.max(.5, Math.round(px*20)/20);
    bb = pad(bb, 4);
    const key = (g.getAttribute('data-k')||'') + '|' + px.toFixed(2) + '|' + [bb.x,bb.y,bb.width,bb.height].join(',');
    let url = cache.get(key);
    if(!url){
      const clone = g.cloneNode(true);
      clone.querySelectorAll('image.px-img').forEach(n=>n.remove());
      const rim = document.body.classList.contains('lowfx') ? '' : ' filter="url(#moonrim)"';
      url = await toURL(`<g${rim}>${clone.innerHTML}</g>`, bb, px, allDefs());
      if(!url) return;
      cache.set(key, url);
    }
    if(!g.isConnected) return;
    const w = document.createElementNS(NS,'g'); w.setAttribute('class', hero ? 'px-mon px-hero' : 'px-mon');
    w.appendChild(imageEl(url, bb));
    const host = hero ? (g.querySelector('.h-bob') || g) : g;
    if(hero){ const hb = host.getCTM && host.getCTM(), gg = g.getCTM(); if(hb && gg && host!==g){ const m = hb.inverse().multiply(gg); w.setAttribute('transform', `matrix(${m.a},${m.b},${m.c},${m.d},${m.e},${m.f})`); } }
    host.appendChild(w);
    g.classList.add('px-on');
  }
  let queued = false;
  function sweep(){
    queued = false;
    if(!on) return;
    document.querySelectorAll('#sceneSvg:not(.pxd)').forEach(scene);
    document.querySelectorAll('svg.title-bg:not(.pxd)').forEach(title);
    document.querySelectorAll('.pxm:not(.pxd)').forEach(monster);
  }
  const kick = ()=>{ if(!queued){ queued = true; requestAnimationFrame(()=>requestAnimationFrame(sweep)); } };
  new MutationObserver(kick).observe(document.body, { childList:true, subtree:true });
  kick();
  function set(v){
    on = !!v; try{ localStorage.setItem('ql_pixel', on?'1':'0'); }catch(e){}
    document.documentElement.classList.toggle('pixel', on);
  }
  return { get on(){ return on; }, set, sweep };
})();

    targets.forEach(qe=>{ if(qe.hp>0){ qe.hp -= dmg; if(qe.hp<0) qe.hp = 0; } });
    xImpact(4); sfx.hit(true); shake(true);
    floatText(`⚡ ทะลุ ${dmg} x${targets.length}`, HERO_X+40, FLOOR_Y-230, xColor(4), 24, true);
    const cur = curEnemy();
    if(cur && targets.includes(cur)){
      updateEnemyHp(); renderEnemyPanel();
      if(cur.hp<=0 && !b.busy && !b.over){ b.busy = true; await sleep(300); await enemyDies(); }
    }
  }
  // if a queued enemy was already finished off by an earlier pierce, clear it the instant it steps up
  const _xWalk = walkToNext;
  walkToNext = async function(){
    await _xWalk();
    const b = ui.bat, n = curEnemy();
    if(b && n && n.hp<=0 && !b.pendingKill) b.pendingKill = true;
  };
}

/* ======================================================================
   บทที่ 2 — ฉากทุ่งดาวเขียวขจี (ภาพพิกเซลจาก public/scenes/meadow/)
   ใช้ layer id เดิม (lySky … lyFore) เพื่อให้ parallax ตอนเดินทำงานเหมือนเดิม
   ใส่ class "pxd" ไว้ ตัวแปลงภาพพิกเซลจะได้ข้ามฉากนี้ (ภาพเป็นพิกเซลอยู่แล้ว)
   ====================================================================== */
const MEADOW = { dir:'scenes/meadow/', v:1,
  size:{ sky:[513,169], grass:[508,56], tree:[364,306], ledgeA:[144,91], ledgeB:[144,91], arches:[50,64], fence:[55,24], bush:[64,29], stump:[51,16], blocks:[51,59], stripe:[96,16], dirt:[68,56] } };
function meadowScene(seed, depth){
  const rng = mulberry(seed||1), R = (a,b)=>a+rng()*(b-a), pick = a=>a[Math.floor(rng()*a.length)];
  const S = MEADOW.size, src = n=>`${MEADOW.dir}${n}.png?v=${MEADOW.v}`;
  const img = (n, x, y, s=1, extra='')=>`<image href="${src(n)}" x="${Math.round(x)}" y="${Math.round(y)}" width="${S[n][0]*s}" height="${S[n][1]*s}" ${extra}/>`;
  const onFloor = (n, x, s=1)=>img(n, x, 326 - S[n][1]*s, s);          // bottom sits on the grass top (y 326)
  // sky: stars + lake with islands, scaled up and static
  const sk = 2.45, skW = S.sky[0]*sk;
  let sky = `<rect x="-50" y="-50" width="900" height="500" fill="#8fd8ff"/>`;
  for(let x=-40; x<840; x+=skW) sky += img('sky', x, -34, sk);
  // far (parallax .45): Whispy-style trees + floating striped platforms
  let far = '';
  for(let k=0;k<4;k++){ const x = 180 + k*820 + R(-60,60);
    far += img('tree', x, 326 - S.tree[1]*1.05 + 24, 1.05);
    if(rng()<.8) far += img('stripe', x + R(-120,-40), R(120,170), 1.2) + img('stripe', x + R(300,380), R(110,160), 1.2); }
  // near (parallax 1): fenced ledges, arches, star blocks, bushes, stumps
  let near = '';
  for(let x=-260; x<4700; x+=R(260,420)){
    const r = rng();
    if(r<.3) near += img(pick(['ledgeA','ledgeB']), x, 356 - S.ledgeA[1]);
    else if(r<.5) near += onFloor('arches', x) + onFloor('fence', x + 44) + onFloor('bush', x + 90);
    else if(r<.68) near += onFloor('blocks', x) + onFloor('bush', x + 48);
    else if(r<.84) near += onFloor('fence', x) + onFloor('fence', x + 55) + onFloor('stump', x + 118);
    else near += onFloor('bush', x) + onFloor('bush', x + 60, .9);
  }
  // floor: bushy grass strip (slab top at y 326) over wavy star soil
  const gTop = 326 - 28;
  let floor = `<defs><pattern id="mdDirt" patternUnits="userSpaceOnUse" x="0" y="350" width="${S.dirt[0]}" height="${S.dirt[1]}"><image href="${src('dirt')}" width="${S.dirt[0]}" height="${S.dirt[1]}"/></pattern></defs>
    <rect x="-900" y="348" width="5700" height="120" fill="url(#mdDirt)"/>`;
  for(let x=-900; x<4800; x+=S.grass[0]-2) floor += img('grass', x, gTop);
  // a few front bushes for depth
  let fore = '';
  for(let x=-200; x<5400; x+=R(380,640)) fore += img('bush', x, 400 - 22, 1.3, 'opacity=".95"');
  const dark = Math.min(.3, (depth||0)*.03);
  return `<svg class="scene-svg sc9 th-woods meadow pxd" id="sceneSvg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs><radialGradient id="vig-md" cx="50%" cy="42%" r="75%"><stop offset="62%" stop-color="#021030" stop-opacity="0"/><stop offset="100%" stop-color="#021030" stop-opacity=".35"/></radialGradient></defs>
  <g id="lySky">${sky}</g>
  <g id="lyBack"></g>
  <g id="lyFar">${far}</g>
  <g id="lyNear">${near}</g>
  <g id="lyFloor">${floor}</g>
  <rect x="-1200" y="-400" width="4000" height="1000" fill="#02040e" opacity="${dark.toFixed(2)}" pointer-events="none"/>
  <g id="actors"></g>
  <g id="lyFore">${fore}</g>
  <rect id="vig" x="0" y="0" width="800" height="400" fill="url(#vig-md)" pointer-events="none"/>
  <g id="fx"></g>
  </svg>`;
}
/* ======================================================================
   ฉากหลังภาพพิกเซล (public/scenes/bg/) ใช้กับบทที่ 1, 3, 4, 5 และหอคอย
   บทที่ 2 ใช้ฉาก Star Meadow ของตัวเอง
     crypt (หนู สไลม์ ค้างคาว โครงกระดูก)  → ถ้ำใต้ดิน
     ice   (ผี ปีศาจน้ำแข็ง ตุ๊กตาหิมะ)      → ภูเขาหิมะ · ด่าน 7–8 กลางคืน
     lava  (ปีศาจไฟ ซาลาแมนเดอร์)          → กำแพงปราสาท + แสงเพลิง · ด่าน 7–8 ปราสาทมืด
     necro (ซอมบี้ วิญญาณ มัมมี่)           → บ้านผีสิง · ด่าน 7–8 กำแพงผีสิงยามดึก
   ภาพฉากหลังอยู่ในกลุ่ม #lyImg (ไม่ถูกแปลงพิกเซลซ้ำ) ส่วนพื้น/ของประกอบยังเป็นของเดิม
   ====================================================================== */
const SCENE_BG = {
  crypt:{ day:'cave',  late:'cave',        top:'#49423f' },
  ice:  { day:'snow',  late:'snownight',   top:'#156eb5', topLate:'#003a66' },
  lava: { day:'castle',late:'castlenight', top:'#3d3d3d', topLate:'#13162d', glow:'#ff4a1a' },
  necro:{ day:'ghost', late:'ghostnight',  top:'#000000', topLate:'#13162d' },
};
sceneSVG = (_sc=>function(themeId, seed, depth){
  const html = _sc(themeId, seed, depth), B = SCENE_BG[themeId];
  if(!B) return html;
  try{
    const late = (depth||0) >= 7, name = late ? B.late : B.day, top = late && B.topLate ? B.topLate : B.top;
    const doc = new DOMParser().parseFromString(html, 'image/svg+xml'), svg = doc.documentElement;
    if(svg.querySelector('parsererror')) return html;
    const NS = 'http://www.w3.org/2000/svg';
    ['lySky','lyBack'].forEach(id=>{ const g = svg.querySelector('#'+id); if(g) while(g.firstChild) g.removeChild(g.firstChild); });
    const s = .8, w = 512*s, h = 512*s, y = 336 - h;
    let inner = `<rect x="-600" y="-500" width="2000" height="${Math.ceil(500+y+2)}" fill="${top}"/>`;
    for(let x=-420; x<1240; x+=w) inner += `<image href="scenes/bg/${name}.png?v=1" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w}" height="${h}" style="image-rendering:pixelated"/>`;
    if(B.glow) inner += `<rect x="-600" y="${(y+h*.35).toFixed(1)}" width="2000" height="${(h*.65+20).toFixed(1)}" fill="url(#bgGlow)"/>`;
    const g = doc.createElementNS(NS, 'g'); g.setAttribute('id', 'lyImg'); g.innerHTML = inner;
    if(B.glow){ const defs = svg.querySelector('defs') || svg.insertBefore(doc.createElementNS(NS,'defs'), svg.firstChild);
      defs.insertAdjacentHTML('beforeend', `<linearGradient id="bgGlow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${B.glow}" stop-opacity="0"/><stop offset="1" stop-color="${B.glow}" stop-opacity=".38"/></linearGradient>`); }
    const sky = svg.querySelector('#lySky'); svg.insertBefore(g, sky || svg.firstChild.nextSibling);
    // soften the vector far ridge so the painted backdrop reads through
    const far = svg.querySelector('#lyFar'); if(far) far.setAttribute('opacity', '.8');
    return new XMLSerializer().serializeToString(svg);
  }catch(e){ return html; }
})(sceneSVG);
sceneSVG = (_sc=>function(themeId, seed, depth){ return themeId==='woods' ? meadowScene(seed, depth) : _sc(themeId, seed, depth); })(sceneSVG);
